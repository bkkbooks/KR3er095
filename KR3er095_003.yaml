body:
  text: 下卷中厥條辨辨非風形證歌類中因虛內出風卒然仆倒眼朦朧尿遺手撒歪斜眼數種俱然症卻凶小腹冷如冰石者急宜氣海灸能通炒鹽艾附當臍尉寒散陽回立見功類中者其風自內出也七情縱恣六淫外侵真陰不守久之水衰火盛風從火出離其故宮飛揚飄遂卒然仆倒故其人兩腎腰胯間及臍下必冰冷如鐵蓋別病必他臟先病緩緩窮到腎經惟此病竟是腎經與命門無形之水火自病故一病竟絶也當其發病之際必有一股虛氣從兩腎中間上夾脊穿崑崙過泥丸直到命門命門為三陰三陽聚處此股氣一衝三陰三陽之氣亦突然而散遂外不省人事而在內臟腑之氣亦隨之而去臟腑之氣既去而手撒眼合或開而直視遺尿聲齁口開等證又相隨而來矣此命門即素問至陰之根結於命門乃兩腎之上下左右各相去一寸其中間便是丹家之元神也此股虛氣是即所謂無形之火也緣無形之水虛不能守遂化作冷風騰空而去矣非風脫症辨須分知絶肝經眼合瞑若是口開心臟絶聲鼾手撒肺脾論尿遺腎絶誠當識目攛搖頭面赤增吐沫汗珠兼直視理中大劑倍人參以上形狀大抵見一種猶可數種俱見亦為不治猶當急以手按其少腹冰冷如石者速急灸氣海穴穴在臍下一寸五分並用蒸臍法湯中再加附子腎內真陽本素衰虛邪衝動倒塵埃脈來三至如綿軟附子人參當即培初發可療遲不治勢平參附養榮該照常二便飲如故大料補中八味偕此大虛之症其脈必二三至闊大虛軟如棉花急煎人參一二兩附子一兩或有生者如發時可救遲則無及矣俟其勢定方用人參五錢黃耆二兩附子五錢不數飲之但覺臍下溫和手足運動口眼能動是矣待飲食如常二便如故大劑補中益氣湯加附子三錢吞八味丸兩許榮衛調和漸可康復否則終難延命其如頭目暈難開開見般般物倒排蕩漾胸中如欲吐慎防類中漸將來及時服餌還憑脈兩尺如虛肝腎頽脾肺寸關求索診培元救本戒休乖其有平日頭目眩暈難開開之即見居室百物俱倒轉胸中漾漾噁心欲吐即類中風之漸急須節飲食戒七情遠房事以預防之治法同上但不灸藥物足矣然服預防之藥當察其脈如兩尺虛衰者六味八味等丸培補肝腎寸關虛弱者六君十全等劑調補脾肺才有補益若服搜風順氣及清氣化痰等藥適所以招風取中也東醫寶鑑云凡大指次指麻木或不用者三年內有中風之患薛立齋云預防者當養氣血節戒情欲自可無虞若服愈風湯天麻丸之類非惟無益倘反引邪入內滋患為害也辨中風形證歌真中南稀北自多藥宜小續命湯瘥杏防防芍芩麻桂附草參芎保太和北方地燥高阜生風南方地濕卑堅多雨是以中風北方多而南方少也按歷代相傳治中風之方皆以續命湯為主考其所自則始於金匱要略然此必宋時校正之所增而非仲景本方也自隋唐以來則孫氏千金而亦採附故後世宗之無不以此為中風主治矣但方內以麻桂並用薑附同施而佐以芎防本為發散外邪之設也如非風類中切勿亂投中風閉症認何形握手牙關語不能二便不通如目瞀耳聾鼻塞口無吩不妨三化湯投治枳朴羌黃一泄平平素氣虛兼血弱麻仁丸主莫遲停假如其人素有積熱或鬱火暴發則風乘火勢火借風威而風為熱風矣多見閉症法當疏風開竅先用搐鼻散吹之次用牛黃丸灌之若大便閉結腹滿脹悶火勢極盛者以三化湯攻之如或血虛腸燥之人易以麻仁丸潤下之設內有寒氣大便反硬名曰陰結陰結者得和氣暖日寒冰自化勿可誤用攻藥誤即不能復救慎之慎之閉或痰多湧似潮三生飲與可能消南星附子川烏等再配人參一兩熬假如其人素挾寒或暴受新寒則風水相搏寒冰徹骨而風為寒風多見脫絶之症當溫補元氣急用附子理中大劑灌之若以痰涎壅盛以三生飲加參兩許灌之間有寒痰壅塞介乎閉脫之間不便驟補者用半夏橘紅各一兩濃煎至一杯以生薑汁對衝頻頻灌之其人即蘇然後按其虛實而調治之痱風足廢舌瘖形會厭邪侵話不明蹇澀喁喁聲似啞治分虛實莫胡行夫中風不語者有心脾腎三經之異又有風寒客於會厭卒然無音者大法若痰迷心竅當清心火牛黃丸神仙解語丹若因風痰聚於脾經當導痰涎二陳湯加竹瀝薑汁並用解語丹若因腎經虛火上炎當壯水之主六味湯加遠志石菖蒲若因腎經虛寒厥逆當益火之原劉河澗地黃飲子或用虎骨膠丸加鹿茸若風寒客於會厭聲音不揚者用甘桔湯加疏散之藥或兼服轉舌膏亦可也歪斜口角大秦艽兩活辛芎草共膏芍術芩苓和二地當歸防芷把名標此中血脈中在經絡之中也按口眼喎邪多屬胃土而有筋脈之分經云足之陽明手之太陽筋急則口目則僻皆急不能卒視此胃土之筋病也又云足陽明之脈挾口環唇此胃土之脈為病也口目常動故風生焉耳鼻常靜故風息焉先燒皂角薰之以逐外邪次燒降香薰之以順血脈再用酒煎桂枝取汁一碗軟青布浸收左歪拓右右歪拓左中風仆倒語難言口噤牙關緊閉間皂角明礬吹取嚏薑湯蘇合一丸研按蘇合香丸乃斬關奪命之將為中風閉症而設若或施之非風類中之脫症如人已入井而反下之石鮮有不隨藥而斃者也用者審之按手三陽之筋結入於頷頰足陽明之筋上夾於口風寒乘虛入其筋則攣故令牙關急而口禁也中腑身疼現六經依經據理治宜分初然跌倒難言語黑豆煎飴一味斟認明六經形證仍遵仲景以外感之法治之其有始初昏僕無知脈症並無脫狀宜先濃煎黑豆汁灌之即醒然後隨症用藥蓋黑豆善治虛風之聖品昔葉天士嘗用療此多效厥僕辨治歌酒厥體質魁梧飲酒頻突然舌強語難清喎斜口眼痰聲湧煨葛山梔曲六君風厥脅脹先疼肢不收淋漓自汗便齊流牙關目瞤方犀角草術參耆歸棗投二活芎防芩枳殼薑膏麻菊配羚周怒多能食如前證再繼逍遙病定廖虛厥目睜上視僕如昏溲汗無時脈少倫久病陰虛陽暴絶關元急灸獨參生血厥無疾平居忽冒眩驟然默默口無言惡聞人語時方寤鬱冒更名血厥煎此症宜倉公白薇散其病名又謂之煎厥薄厥怒氣傷肝火上奔胸中氣亂厥呈形證名薄厥蒲黃主清酒加煎須飲溫尸厥五尸穢氣暴淫人離亂陰陽不順承狀若死尸形似厥調中正氣莫留停食厥上身腹悶熱心煩臍下如冰烘已寒氣阻陽明為食厥保和平胃自能安濕厥大便稀溏小水黃頭疼膝腫體拘傷挾痰中濕由生熱內外分消虛實詳此症宜與感證類要疫癘條下軟腳瘟並參暑厥面垢肢寒倒悶沉渴來喘嘔利猶增三陰中暑宜辛熱大順香薷及臭靈靜而得之謂之中暑名曰陰暑厥症其有或納涼於廣廈或過食於生冷頭疼惡寒肢節疼痛大熱無汗此陰寒所遏陽氣不得發越亦多厥僕二者俱宜溫散如輕者香薷飲重者大順散或研蒜水灌之熱厥勞役長途赤日中汗多氣少渴相從躁煩頭痛名陽暑膚熱昏迷白虎功動而得之謂之中熱中熱者陽症也熱傷元氣非形體受病也或行役於長途或務農於赤日頭痛躁熱肌膚大熱大渴多汗少氣宜蒼朮白虎湯主之痰厥痰厥昏迷不省事喉中卻似水雞聲白礬牙皂研吹鼻一盞香油灌即醒此症醒後審明虛實宜理氣消痰氣厥氣厥依稀似中風惟茲身冷不相同有痰四七導痰飲術桔芩連六子功加用星蔞與蘇葉或如正氣藿香逢木沉香配檳榔枳烏藥磨沖白酒濃蛔厥蛔厥分明屬胃寒吐蛔疼痛理中參乾薑參朮休甘草加入椒梅道豈凡此症理中湯主之但蟲遇甜味更覺要痛故方內要去甘草蟲見酸辛則安宜加川椒烏梅如痛甚者可加苦楝樹根皮祟厥忽倒塵埃暈不知脈來兩手各參差頃時灌醒喃喃語大指須將艾灸施下劑精詳原有祕降檀豆蔻洎桃枝藿烏薑草陳蒼朴鹿角砂仁邪避馳是症宜灸大指鬼哭穴病人床前可多焚降香惡厥腸鳴寒粟起肌膚客忤狂言面帶烏厥逆迷沉口自噤香丸蘇合灌能蘇蘇合丸昔日廣東周少川制者四遠馳名用者立效近日佛山鎮潘務本修合者比衆更佳凡逢卒僕覺狐疑湯用生薑且探迷略待神思稍定後認明證治擬方宜明哲論選劉宗厚玉機微義云余嘗至涼州其地高阜四時多風少雨天氣常寒每見中風或暴死者有之蓋折風燥烈之甚也時洪武乙亥秋八月大風起自西北時甘州城外路死者數人余亦始悟經謂西北之折風傷人主病暴死之旨不誣丹溪之言有所本也籲醫之不明運氣地理造化之幾微而欲行通變之法者難矣哉張介賓云據此一説是誠風之殺人也然風氣兼溫雖烈未必殺人惟帶寒威則殺人耳矧以西北地寒而風寒起於八月則寒隨風至寒必徹骨凡暴露之人雖曰中風而不知實中陰寒之毒也此在強者固能支持弱者焉得不死然亦所遇之異故特記若此方是真中風邪則亦百十年間始方僅遭一二而此症之不多見者從可知矣此外如賊風虛風之傷人則歲歲有之處處有之是無非外感之病未聞有因外感而卒然昏憒致死也矧今人之所謂中風者或於寂然無風之時或於食飲嚴密之處素無外感而忽然暈僕忽然偏廢此其似風非風又可知矣而盡以風治其能堪乎喻嘉言寓意草云丹溪方書有曰半身不遂大率多痰在左屬死血少血宜四物湯加桃仁紅花竹瀝薑汁在右屬氣虛屬痰宜二陳湯四君子湯加竹瀝薑汁教人如此認症因而復起後人之執著至內經則無此説也內經但言左右者陰陽之道路夫左右既為陰陽往還之道路何嘗可偏執哉況左半雖血為主非氣以統之則不流右半雖氣為主非血以麗之則易散故肝膽居左其氣嘗行於右脾胃居右其氣嘗行於左往來灌注是以生生不息也凡治一偏之病法宜從陰引陽從陽引陰從左引右從右引左盍觀樹木之偏枯者將溉其枯者乎抑溉其未枯使榮茂而因其條暢其枯者乎張景嶽云非風一證即時人所謂中風證也此症多見卒倒卒倒多由昏憒本皆內傷積損頽敗而然原非外感風寒所致而古今相傳咸以中風名之其誤甚矣故余欲易去中風二字而擬名類風又欲擬名屬風然類風屬風仍與風字相近恐後人不解仍爾模糊故單用河澗東垣之意竟以非風名之庶乎使人易曉而知其本非風症矣又云凡診諸病必先宜正名觀內經諸篇所言風症各有淺深臟腑虛實寒熱之不同本皆歷歷可考也若今人之所謂中風者則以內經之厥逆悉指為風矣延誤至今莫有辨者雖丹溪云今世所謂風者大率與痿症混同論治此説固亦有之然何不云誤以厥逆為風也惟近代徐東翛有云痓厥類風凡尸厥痰厥氣厥血厥酒厥食厥等皆與中風相類此言若乎近之而殊亦未善也使果風厥相類則凡臨是症者曰風可也曰厥亦可也疑似未決將從風乎將從厥乎一知經所言者風自風厥自厥也風之與厥一表症也一里症也豈得謂之相類耶奈何後人不能辨察經義而悉以厥症為風既名為風安得不從風治既從風治安得不用散風之藥以風藥而散厥症所散者非元氣乎因致真陰愈傷真氣愈失是速其死矣若知為厥則原非外感自與風字無涉此名之不可不正症之不可不辨也但名得其正又何至有誤治之患矣通一子云凡非風等症在古人諸書皆雲氣體虛弱榮衛失調則真氣耗散腠理不密故邪氣乘虛而入此言感邪之由豈不為善然有邪無邪則何可不辨夫有邪者即傷寒瘧痹之屬無邪者即非風衰敗之屬有邪者必或為風寒走注或為腫痛偏枯而神志依然無恙也無邪者本無痛苦寒熱而肢節忽廢精神言語倏爾變常也有邪者病由乎經即風寒濕三氣之外侵也無邪者病出乎臟而精虛則氣去所以為眩暈卒倒氣去則神去所以為昏憒無知也有邪者邪必乘虛而入故當先扶正氣但通經逐邪之品不得不用以為佐無邪者救本不暇尚敢再為雜用以傷及正氣乎張介賓曰凡五臟皆能致病而風厥等症何以獨重肝邪且其急暴之若此也蓋人之所賴以生者惟在胃氣以胃為水穀之本也故經云人無胃氣曰死脈無胃氣亦死夫肝邪者即胃氣之賊也一勝則一負不相併立凡此非風等症其病為強直掉眩之類皆肝邪風木之化也其為四肢不用痰涎壅盛者皆胃敗脾虛之候也然雖曰東方之實又豈果肝氣之有餘耶正以五陽俱敗肝失所養則肝從邪化是曰肝邪故在陰陽類論以肝臟為最下者正謂其木能犯土肝能犯胃也然肝邪之見本由脾腎之虛使脾土不虛則肝木雖強必無乘脾之患使腎水不虛則肝木得養又何有強直之虞所謂胃氣者即二十五陽也非獨指陽明為言也所謂腎水者即五臟六腑之精也非獨指少陰為言也然則真陽敗者真臟見真陰敗者亦真臟見凡脈證之見真臟者俱為危敗之兆所謂真臟者即肝邪也即無胃氣也此即非風類中之大本也又云凡非風卒倒等症無非氣脫而然何也蓋人之生死全由乎氣氣聚則生氣散則死凡病此者多以素不能慎或七情內傷或酒色過度先傷五臟之真陰此致病之本也再或內外勞傷復有所觸以損一時之元氣或以年力衰邁氣血將離則精損為頽此發病之因也蓋其陰虧於前而陽損於後陰陷於下而陽乏於上以致陰陽相失精氣不交所以忽爾昏憒卒然仆倒此非陽氣暴絶之候乎故其為病而忽為汗出者營衛之氣脫也或為遺尿者命門之氣脫也或口開不合者陽明經之氣脫也或口角流涎者太陰臟氣之脫也或四肢癱軟者肝脾之氣敗也或昏倦無知語言不出者神敗於心精敗於腎也凡此皆衝任氣脫形神俱敗而然故必於中年之後乃有此症何今人見此無不指為風痰而治從消散不知風中於外痰鬱於中皆實邪也而實邪為病何遽令人暴絶若此且既絶如此尚湛幾多消散而人不能悟良可哀也觀東垣云氣衰者多有此疾誠知要之言也奈後人不明其説但以東垣為主氣又豈知氣之為義乎故凡治卒倒昏沉等症若無痰氣阻塞必須以大劑參附峻補元氣以先其急隨用地黃當歸枸杞之類填補真陰以培其本蓋精即氣之根氣生於下即向生之氣也經云精化為氣即此之謂舍是之外他無實濟之術矣雖然夫以養生失道而病令至此敗壞可知猶望復全誠非易也第治得其法猶可望其來復若誤治之則何堪再誤哉又云凡非風之多痰者悉由中虛而然夫痰即水也其本在腎其標在脾在腎者以水不歸原水泛為痰也在脾者以食飲不化土不制水也不觀之強壯之人任其多飲多食則隨食隨化未見其為痰也惟是不能食者反能生痰此以脾虛不能化食而食即為痰也故凡病虛勞者其痰必多而病至垂危其痰益甚正以脾氣愈虛則全不能化而水泛盡為痰也然則痰之與病病由痰乎痰由病乎豈非痰必由於虛乎可見天下之實痰無幾而痰之宜伐者亦無幾故治痰者必當溫脾強腎以治痰之本使根本漸充則痰將不治而自去矣張會卿曰余嘗聞之俗傳云痰在周身為病莫測凡癱瘓瘛瘲半身不遂等證皆伏痰留滯而然若此痰飲豈非邪類不去痰邪病何由愈余曰汝知痰之所自乎凡經絡之痰蓋即津血之所化也使果榮衛和調則津自津血自血何痰之有惟是元陽虧損神機耗敗則水中無氣而津凝血敗皆化為痰耳此果痰也果津血也豈以津血之外而別有所謂痰者耶若謂痰在經絡非攻不去則必並精血而盡去之庶乎可也否則安有獨攻其痰而津血自可無乎津血復傷元陽愈竭隨去隨化痰必愈甚此所以治痰者不能盡而所盡者惟元氣也矧復有本無痰氣而妄指為痰以誤攻之者又何其昧之甚也故凡用治痰之藥如滾痰丸清氣丸化痰丸搜風順氣之類必其元氣無傷偶有壅滯而或見微痰之不清者乃可暫用分消豈云無效若痰及元氣而但知標則未有不日用而日敗者矣又曰肥人多有非風之症以肥人多氣虛也何以肥人反多氣虛蓋人之形體骨為君也肉為臣也肥人者柔勝於剛陰勝於陽者也且肉以血成總皆陰類故肥人多有陽衰氣虛之症而多濕多滯故氣道多有不利若果痰氣壅滯則不得不先為清利宜於備急治痰之法隨宜暫用若無痰而氣脫卒倒必宜四君六君十全大補之類重用參附為主也凡非風初病而痰氣不甚者必不可猜其為痰而妄用痰藥此大戒也若果痰涎壅盛填塞胸膈湯液俱不能入則不得不先開其痰以通藥食之道而開痰之法惟吐為捷如古方之獨聖散茶調散稀涎散之屬皆吐痰之劑也但恐元氣不足不能當此峻利之物或但用和陳中所附吐法為妥或用牛黃丸抱龍丸之類但使咽喉氣通能進湯飲即止不可盡攻其痰致令危困則最所慎之以故治痰之法又必察其可攻與否然後用之斯無誤也若其眼直咬牙肢體拘急面赤強徑有力者雖見昏沉亦為可治先用粗筋之類挖開其口隨以堅實筆桿捺住牙關乃用淡淡薑鹽湯徐徐灌之然後以中食二指探入喉中徐引其吐若指不能入則以鵝翎蘸湯代指探吐亦可如是數次得吐氣通必漸蘇矣然後酌宜可以進藥治之此治實痰壅滯之法也若死症已具而痰聲漉漉於喉間者吐亦無益不必吐也若痰氣盛極而不能吐者亦不治之症也凡形氣大虛者忌用吐法是皆不可攻者也華岫云曰風為百病之長故醫書咸以中風列於首門其論症有真中類中中經絡血脈腑腑之分其論治則有攻風劫痰養血潤燥補氣培元之治蓋真中雖風從外來亦由內虛而邪得以乘虛以入北方風氣剛徑南方風氣柔和故真中之病南少北多其真中之方前人已大備不必贅論其類中之症則河澗立論云因煩勞五志過極動火而卒中皆因熱甚生火東垣立論因元氣不足則邪湊之令人僵仆卒倒如風狀是因乎氣虛而丹溪則又云東方氣溫多濕由濕生痰痰生熱熱生風故主乎濕三者皆辨明類中之由類者偽也近代以來醫者不分真偽每用羌防星半烏附細辛以祛風豁痰虛證實治不啻如枘鑿之殊矣今觀葉天士先生醫案發明內風乃身中陽氣之變動肝為風臟因精血衰耗水不涵木木少滋榮故肝陽偏亢內風時起治以滋液熄風濡養營絡補陰潛陽如虎潛固本復脈之類是也若陰陽並損無陽則陰無以化故以溫柔濡潤之劑補之如地黃飲子還少丹之類是也更有風木過動中土受戕不能御其所勝如不寐不食衛疏汗泄飲食變痰治以六君玉屏風茯苓飲酸棗仁湯之屬或風陽上僭痰火阻竅神識不清則有至寶丹芳香宣竅或辛涼清上痰火法雖未備實足以補前人之未及至於審症之法有身體緩縱不收耳聾目瞀眼合撒手遺水失音鼾睡此本實先撥陰陽樞紐不交與暴脫無異非是中外邪之風乃純虛症也故先生急用大劑參附以回陽恐純剛難受必佐陰藥以挽回萬一若身體拘攣半身不遂口眼喎邪舌強言蹇二便不爽此本體先虛風陽夾痰火壅塞以致營衛脈絡不和治法急則先用開關緩則益氣養血佐以消痰清火宣通經隧之藥氣充血盈脈絡通利則病可全愈至於風痱風懿風痹癱瘓乃風門之兼理亦相同案中種種治法未能盡宣其理不過略舉大綱分類敘述以便後人觀覽鄒新甫曰厥者從下逆上之謂痙者明其風強之狀所以二字每每並言原與傷寒門所載者有間想是症總由氣血日偏陰陽一併而成譬如風雷猛烈鬱極而發若發而漸復者猶可轉危為安若發而轉逆者必至直拔根荄乃已考方書之名目不一致病之因由亦繁大抵可吐者如痰食填塞於胸中用瓜蒂散之類及燒鹽探引方法可清可折者如厥陽壯火升逆而莫制用景嶽玉女煎及宣明龍薈丸法可開可降者如氣厥薄厥而形氣暴絶有五磨飲子及蒲黃酒法穢濁蒙神而昏亂無知有牛黃至寶及蘇合香丸之兩法飛尸卒厥先宜酒醴以引導並可按穴而施針法及灸法若從虛而論者如內奪而厥則為瘖痱有地黃飲子通攝下焦法煩勞陽張令人煎厥有人參固本加金箔方諸水為壯水制火法血厥而陽騰絡沸參乎從陰從陽法色厥而精脫於下急與大劑挽元法腎厥宗許學士之椒附以通陽蛔厥有仲景之安蛔法陽極用救陰峻劑陰極有扶陽方法種種規模以為全備及參葉氏案中先生於是症獨重在肝蓋肝者將軍之官善幹他臟者也肝氣一逆則諸氣皆逆氣逆則痰生遂火沸風旋神迷魂蕩無所不至矣若犯於上者不免凌金爍液有麥門冬湯及瓊玉膏之補金柔製法若犯於中而為嘔為脹者用六君去朮加木瓜薑芍之類及附子粳米湯加人參為補胃凝肝法若震及心脾而為悸為消者用甘麥大棗湯合龍蠣之屬為緩急重鎮法若挾少陽之威而乘巔搖絡者用羚羊鉤藤元參連翹之劑為熄風清絡法若本臟自病而體用失和者以椒梅桂芍之類為益體宣用法若因母臟之虛而擾及子臟之位者用三才配合龜甲磁朱及復脈減辛味復入雞黃之屬為安攝其子母法至於痿厥之治猶覺神奇取血肉介類改湯為膏謂其力味重實填隙止厥最速此豈非補前人之未備開後學之法門哉參是案者幸毋忽諸尊生祕笈老子曰穀神不死是謂玄牝玄牝之門是謂天地根綿綿若存用之不勤又曰生之門死之戶廣成子曰毋勞爾形毋搖爾精乃可以長生隱求子曰培養精元貴節房更祛塵纍最為良食惟半飽宜清淡酒止三分勿過傷藥餌隨時宜勉進功名有分不須忙幾行俚語君能味便是長生不老方集方附後是編之中應用湯丸已經各證條下隨症附歷注明者茲不復載惟將明哲論議之方彙集於後以便查閲決陰煎熟地當歸澤瀉牛膝烏藥肉桂酸棗仁湯棗仁甘草知母茯苓川芎外臺茯苓飲茯苓人參白朮枳實橘紅生薑還少丹熟地山藥牛膝枸杞山萸茯苓杜仲遠志五味小茴巴戟楮實肉蓯蓉石菖蒲虎潛丸熟地龜板黃柏知母瑣陽當歸牛膝白芍陳皮虎脛骨羯羊肉固本丸人參天冬麥冬生地熟地玉屏風散黃耆白朮防風倉公白薇散白薇人參當歸甘草蒲黃飲蒲黃五錢生熟各半以酒煎熱服藿香正氣散藿香紫蘇白芷腹皮茯苓白朮夏曲厚朴桔梗甘草平胃散蒼朮厚朴陳皮甘草保和丸山楂神麯茯苓半夏陳皮連翹蘿蔔子大順散乾薑肉桂杏仁甘草臭靈丹即大蒜一味四七湯一名七氣湯人參官桂半夏甘草生薑金匱麥門冬湯麥冬半夏人參甘草大棗粳米附子粳米湯附子半夏甘草粳米甘麥大棗湯甘草小麥大棗三才湯天冬熟地人參瓊玉膏地黃茯苓人參白蜜臞仙加琥珀沉香玉女煎熟地石膏知母麥冬牛膝地黃飲子熟地巴戟山萸蓯蓉附子官桂石斛茯苓菖蒲遠志麥冬五味當歸龍薈丸當歸五錢膽草五錢山梔一兩黃連五錢黃柏三錢黃芩大黃各一兩青黛三錢蘆薈一兩木香三錢麝香二錢蜜為丸每丸計重三錢薑湯調服至寶丹犀角鎊硃砂飛雄黃飛琥珀碾玳瑁鎊以上各一兩水安息香一兩以無灰酒熬成膏如無以旱安息香代之西牛黃五錢麝香一錢龍腦即冰片一錢金銀箔各五十片共為極細末將安息香膏重湯煮入諸藥搜和分作百丸蠟護臨用參湯化下清心牛黃丸黃連黃芩山梔鬱金辰砂牛黃上各一錢共研勻煉蜜為丸每丸計重五分以竹心湯調服或涼開水調送亦可神仙解語丹白附子炮石菖蒲去毛遠志肉甘草水泡天麻羌活全蠍去尾甘草水洗陳膽星各一兩廣木香五錢上共為末以麵糊為丸如龍眼大每服一丸薄荷湯調下轉舌膏連翹遠志薄荷柿霜山梔防風桔梗黃芩酒炒花粉甘草大黃酒製各五錢川芎犀角磨晾乾各三錢上共研勻煉蜜為丸如彈大硃砂為衣每服一丸薄荷五分煎湯調下新方吐法用蘿蔔子二兩搗碎以滾水沖攪勻略澱徐徐服之得快吐即住以稀粥調養蒸臍法薛立齋治寒淫於內治宜辛熱而神脫脈絶藥不能下者急炒鹽艾附子熱尉臍腹以散寒回陽又以口氣補接其氣又以附子作餅熱貼臍間時許神氣稍蘇然後斟酌湯藥救之
