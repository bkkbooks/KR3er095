body:
  text: 跋醫必識病而後能立方古方之傳於今者無慮數萬首古法之傳於今者無慮數百家醫者熟復於古人之法因以通乎古人制方之意則臨病有準繩而術乃日精粗工於軒岐長沙之書曾未窺覽即病機十九猶茫然不能言無論井輸榮合之位置蒼天黔天之氣化也而乃以空疏不學自便創為古方不可治今病之説噫不知古法而徒執其方方不對病病於何瘳醫不自咎轉以咎古人不亦顛乎吾里楓山毛先生倦遊醫部與古為徒嘗著養生經驗合集一書於古方之有成效者既審擇以示人今又著三信編一書則於古法加詳焉其持論也有本有源而宅心之仁用力之勤皆於是乎見是真能熟復古人之法而精其術以濟世者矣昔南史稱徐野人年八十猶歲讀五經一過卒成大儒今先生年八十餘於著述如此以視空疏不學者居何等耶余故欣然為識數言於簡末一以為粗工勸一以為古人快也同裡實庭錢枚拜跋
