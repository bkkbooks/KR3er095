body:
  text: 上卷醫學補遺引言竊聞見道未真奚容論斷立言不切寧免浮誇巍乎前哲難幾卓爾後生可畏況岐黃久彰寰宇各代興崇文章莫盛茲時聖朝隆運惟是經文古奧淺見者索解殊難玄理幽微粗心者會真匪易張景嶽效武侯之八陳喻嘉言法蕭相之三章趙養葵遵孔門之一貫高鼓峰循孫子之五奇諸書迭出固無微不顯無祕不闡矣更可羡者文精句雅韻洽調平能使誦讀之人目爽心開神凝志發然其間尚有可議不可議者存焉豫實碌碌庸才素患迂腐既不能學書學劍復不能學圃學農惟有志於青囊恨不克飲上池水耳故於三餘之下遍考群書知不可議者乃先聖所傳已經後賢闡發諦當者是也其有闡發未當者不得不備論之以公諸世奈何筆底空疏雖欲吐其肺腑終愧拙於雕蟲因思濟世之道在舉之當與不當而已不必拘其言之文質也今豫既信昔人而私淑其意且以補其未發後之人倘有閲是編而信豫者要亦猶豫之信昔矣故題曰三信編原診望聞問切皆診之意也四者固不可膠執一端但有全論者似乎至矣而診之大原仍不在是也夫聖人神以知來智以藏往無有遠近幽深皆能明辨而勿疑殆由心體之明含融天地萬物之理而大無不包細無不入故能如鑑之察形炬之炷暗歟世醫拘拘於望聞問切之中欲求達診之道於戲猶居於物之內而觀於物也真巍乎莫可窮淵乎莫可測矣今高明之士受此惑者猶比比焉設能居於四者之外潛心默悟先復自之天性次詳理之大同俾一旦豁然貫通則或望或聞隨問隨切無不引申觸類而洞得其情經云至道在微變化無窮神而明之其用乃制其斯之謂歟攻補論治病不離攻補惟當之為貴也今方書莫不首言二者人盡知之夫內傷外感等症其治法非攻即補非補即攻即如和劑之中亦必寓攻補之義蓋古方汗吐下皆攻也溫清補皆補也經云毋虛其虛毋實其實故凡外感多實所以仲景專攻內傷多虛由是東垣重補張子和所治村夫其方峻削薛立齊相偶貴介立法溫和今八略云實而誤補不過增病病增猶可治虛而誤攻必先脫元元脫則無治然其言著於攻略固有益於後人倘狃論於補法中則未免流弊矣又有注傷寒論者曰形實氣壯可以攻也形羸氣弱自當補之倘攻弱補壯則實實虛虛夭人性命然此言似是而非亦屬騎牆之見固不足論經云邪之所湊正氣必虛奚有正氣實而反生病者哉故所謂實者邪氣實非正氣實也言虛者確指正氣虛耳若邪氣虛又何病耶豫故曰邪實宜攻邪微可補一言盡之矣然而攻補之道有五試論之一曰氣壯者不必大攻氣弱者不宜驟補此亦專指邪甚者而言大凡形實氣壯之人必非內傷之病或偶然外感此必有一臟或一腑之虛故外邪得乘隙而入若竟無虛又安有外感哉但其別臟腑之氣皆盛故雖感而未必深入其邪亦輕此時稍用解表之藥則邪無不散更察明致感之由從而峻補之以杜其將來則善矣若或過投大散大下之劑則邪氣去後正氣受傷雖其形實氣壯將見正削於中又必新邪來陷轉攻轉陷而無所施治矣若夫形羸氣弱之人五內空虛肌膚疏懈或因內傷必生拂鬱之病陰液不充燎原日熾法當清火導氣散郁疏經始能平靜至若外邪感冒其入必深緣氣弱不能御邪必須汗之下之使邪得解然後緩緩滋培可全愈矣設先投峻補之藥則反助邪攻正非惟無益而反害之二曰攻不全攻補不全補凡邪在氣分必先解散者配合養陰之藥邪在血分務宜疏利者稍加助脾之藥皆不在禁例況陰血充而表邪易去中氣足而積滯能通故云攻不全攻若補不全補又有說焉凡補氣藥中須參升提健運補血藥中宜入理氣通經安心神必兼清火滋腎水猶當逐濕之類三曰攻不及者宜補補不及者宜攻何謂攻不及者宜補蓋表邪未解胃液消亡實積尚存心神飛越斯時也若必欲盡去其邪盡去其積雖用大攻之劑奈正氣已衰邪必內陷法當峻補胃陰如左歸貞元之類則陰液得充汗必湧出肌表邪亦不待攻而自去矣收斂神氣若歸脾養榮等湯君主一明五臟各得其職雖不下積而積亦無不下矣何謂補不及者宜攻凡邪入陽明變生大熱五液煎熬殆盡惟腎中真水一點尚存斯時欲滋津液以一杯之水難救車薪之火故仲景以大黃枳實芒硝急下陽明實邪而承足少陰真水之氣又如邪中三陰寒痰壅塞上下不通一身陽氣暴絶獨絳宮一點真火猶在斯時欲補臟腑之陽氣又似乎壺湯而澆雪山故須投蘇合香丸三生飲以攻痰利氣逐內外之寒邪以宣手少陰君火之氣即如內傷外感之病雖不若是之危險亦必酌其權宜或先攻後補或先補後攻務先其急四曰以補為攻以攻為補此義何居蓋病人有實積於中又素虛氣弱或病後産後皆不任攻法當重用補陰潤下之品俾氣血宣順其積自下如景嶽決津液之義又如風邪屢散不解法當大補氣血以實其表使邪無可存之處如玉屏風之類更有火踞上焦清涼日用不平亦須壯水之主以鎮陽光則火自息矣至如水泛為痰補而逐之久瘧不瘥補而祛之腎虛水腫補而消之脾弱發黃補而利之但凡以補為攻參耆杞地皆當重用之一二三兩始能正氣驟生邪不能敵若輕則反隔礙難通適足助邪增劇又若氣虛中滿不妨加曲蘖香砂之類血枯身痛亦可用行氣導滯之方相火飛騰可以涼解勞傷吐血可以順導久嗽猶當汗透沉痹尚可驅風但其分量須輕不過錢許或數分而止過用則開門引賊矣但用補後不必攻攻後必須補不可不知五曰邪在表者不可攻裡在裡者不可攻表虛在陰者亦可補陽在陽者亦可補陰凡邪之在表使人氣脈不通胸膈飽悶或二便不利皆有之然邪尚未入里倘誤攻之邪必乘虛內陷若邪氣入內熱氣薰蒸必見身疼頭痛誤投發表內外俱傷又增一病又凡陰氣大虛或驟傷陰血此時固當補陰但經云有形之血不能速生幾微之氣所當急固又或陽氣衰微上虛喘急補陽本其要法然傳曰無陽則陰無以生無陰則陽無以化故凡補虛續絶則陰陽互為根本相需而不相離故攻則在乎嚴密補則在乎圓活通前五法不過言其大略至有或當純攻而禁補者或當純補而禁攻者又有忽宜補而又忽宜攻者俱當臨症之際細心體認用得其宜耳新久內外老少標本虛實論醫之義尚矣醫之理微矣殊難一言蔽之然凡病初起皆氣受之若經年纍月則必精竭精竭則神亦亡此一定之理也若虛不受補或病深失治以致於神亡而竟不可挽者由於數盡者半失於調治者亦半也夫斷木可以取水溶金可以得水燃火生液可以得水掘土為泉可以得水故能培五臟則精無不生況圓珠可以得水則假無形以養精也鑽木可以得火鑿金可以得火捶石可以得火水底有火也能養五臟則神無不存況陽燧可以取火則假無形以養神也若外感之致於死者皆緣五氣阻滯經絡不通或火炎而精暴絶或氣亂而神遽揚非內傷枯涸之比也凡治新病首貴疏邪調氣火甚者兼滋陰精氣散者並安陽神所以治外感當救之速耳待邪盡而後補之可也若久病必須豐填精髓峻補真陰安養元神兼調氣血故治內傷不嫌其緩待虛回而後方可攻邪此二者皆常法也若有標急於本者又當斟酌活法老弱者必須先固本原少者新病亦可先補老邁沉疴亦可先攻或用和劑所謂刑德兼施並行不悖者是也但其要旨凡欲攻邪須量稟氣之厚薄若思補正必詳邪感之重輕余故諄諄曰邪甚當攻勿畏正氣虛而先補邪微宜補休泥表未盡而漫攻能知此義可不拘病之新久內外老少標本虛實等類而竟縱橫攻補亦無不善矣經云知其要者一言而終此之謂也藥性疏辨藥物種類繁多似難枚舉試以今時日用而不知者信採數品而詳論之五味子味酸甘核苦辛咸性溫無毒入肺腎二經豫曰若云五味恆全自宜用無偏勝何以惟酸倍甚專司在於收固八略云病在上在表者皆當固氣在下在裡者皆當固精然諸氣藏於肺諸精貯於腎凡收耗亡皆五味之能也但其分量須酌用方書莫辨豫特附詳之蓋輕清者上升重濁者下降此自然之理也故其斂汗定喘解渴療咳收肺氣耗散之金所用不過七粒九粒取其氣也至於固腸澀精強陰除熱滋腎經不足之水不妨用三錢五錢取其味矣倘易二症之宜而多寡誤用非惟無益抑且增劇此一義也甘草味甘平無毒入脾經故熱藥用之欲溫中也涼藥用之清脾胃之火也上升藥用之欲並土臟清氣同升下降藥用之欲與中宮濁氣並降故也又其性能緩凡急攻急散之劑非宜氣偏血偏之病恆用輕用兼屏心肺之熱重加可挽肝腎之脫人參味甘微溫無毒入肺脾二經汗下溫補和五法無不宜用然用於散劑者乃助肺氣使邪易於散也昔人有謂入散藥而助散劑之力故邪易散此言非也經云邪之所湊正氣必虛今人重感於邪故必投大散之藥又必加以人參以助正氣若人參不能固正亦不必用矣豈有復助諸散藥等力更復大散者乎決無是理即下藥用之亦以助脾胃使邪積之易去耳同溫熱藥用者期元氣之驟生則陽回可速補劑自彼專能毋庸議論輕用惟補肺氣重用可實脾土若欲添精於腎生血於肝則非一二兩不可猶必佐以歸地之類白朮味苦甘溫無毒入脾胃二經熟地味甘微寒無毒入心肝脾胃四經邯鄲以為二味不宜同用今景嶽新方屢屢並行而諸書亦未辨晰惟四明列薛氏醫案數方亦曰有可同用有不可同用者此言猶覺拘泥豫釋之曰術多地少是欲滋土中之陰非欲兼補腎也地多術少必使利腰臍間之濕豈期養胃哉若兩味等用方為脾腎兼療法耳即之肺之肝配之合宜亦無不可適或土受熱傷可去朮而竟投熟地水遭濕侮可去地而惟用白朮此其概也黃耆味甘微溫無毒入肺脾二經與人參皆固元氣之藥也遠志味甘辛溫無毒入心胃二經棗仁味酸平無毒入肝膽二經此二味皆養神之藥也枸杞子味甘微溫無毒入腎肝二經與熟地皆添精之藥也當歸味甘辛溫無毒入心肝脾三經白芍味苦酸微寒無毒入肺脾肝三經此二味助生氣之藥也甘草白朮補中氣之藥也古法皆以人參黃耆治肺因肺主元氣也棗仁遠志治心因心主藏神也白朮甘草治脾胃因脾胃屬土為中氣也當歸白芍治肝因肝為生生之氣也熟地枸杞治腎因腎藏精也古法之治善固備矣豫又有說焉天地一太極也五行備焉人生天地之間亦具一太極五臟備焉五臟在人身中亦各具一太極亦各備一五行故高鼓峰特立二十五方豫更有說焉天地人謂之三元人身之三元即精氣神也黃庭經云五臟之中各有神又云五氣運明發霄間內經云六腑注氣而不留五臟注精而不泄由是觀之五臟各又具一精氣神矣然五臟之神皆拱於心五臟之精皆貯於腎故五神虛則心不安五精虛則腎衰憊惟氣有三一曰中氣五臟中之土氣也盛則脾胃旺二曰元氣五臟中之金氣也衰則肺臟耗三曰生氣五臟中之木氣也虛則肝血枯故凡一臟之精虛皆使腎病若竟腎虛則五臟之精皆竭矣神氣亦然而心肝脾肺之往還亦若是也故心精虛者可加杞地於補心清心之內腎神耗者宜投志棗於六味八味之中肝經元氣不足參耆重加於四物八珍無害肺家生氣消削歸芍用於生脈瀉白何傷此一隅也余可仿之即脾胃中土氣自衰的須朮草倘兼四病亦如前法豈不圓通而無滯哉然度理究心務使可分可合知常達變必期能縱能橫是則存乎其人耳脈義心參診脈有道參素難而自可得矣古人以三部九候而審辨之曰上以候上下以候下中以候中此固不易之論或因診視不便故易於兩手之寸口然亦分三部九候之別然皆本太陰之脈也夫臟腑之氣互相交錯無刻不然惟手太陰猶能決其虛實即人飲食入胃其精微之氣上朝於肺經待肺而傳諸百脈於是諸臟腑之氣莫不相隨水穀之精氣而歸詣於肺但其分辨各臟腑部位內經嘗備言之自北朝高陽生歌訣一出世人以其易讀誤信其僞則內經脈義幾乎息矣雖闢者代不乏人及闡經旨則遺漏未暢者甚多至景嶽部位解傳世殆孟子之廓如也參考諸家診法惟李士材正眼為全近世高鼓峰心法之脈義猶當顯豁能熟究二書其原自得豫聞窮理盡性始能達道故物雖號萬而知之不難者在能察其根源耳今脈義以部位定臟腑以二十八脈別病情以十怪脈斷人生死吉凶皆是也其所以然者何故今人所見之脈何象其變態二十有八及怪脈十種何故而使然昔人曰脈乃氣血之先今東垣以診而有力者確然指以為神豫更有說焉夫脈之在於人也非氣非血亦非神也又不可謂非神也昔人曰我生非我有是天地之委氣也易云天行健君子自強不息是脈本人生不息之天機豈可竟擬為是氣是血是神乎彼李氏竟指曰神亦不盡然矣試言外感等症脈大有力者居多豈六淫之邪輒犯於神而然哉故察脈雖可以知神而要亦未盡如此即三部九候亦不宜拘執何也今人臟腑五行而已陰符云天有五賊見之者昌此指五行也又云九竅之邪在乎三要可以動靜此指三元也昔人有云天地之數不可竟曰五不可竟曰三又不可曰非五非三也今人所恃而生者氣也其行氣之主神也而養神之道精也此三者臟腑莫不賴之故論五臟六腑者是從五行之道也而豫諄諄於精氣神者豈無從哉本三才之理耳其義亦分三部九候亦可取決於手太陰之寸口也蓋神寓絳宮應居寸位精藏元海尺位堪求氣塞乎中關脈可決右手屬陽可察陽神陽氣陽精左手屬陰可察陰神陰氣陰精此三才之部位也然陰中有陽陽中有陰如太極之義也至如舉神也尋氣也按精也此又以浮中沉而定三才矣故高鼓峰云暴病以右關為主蓋恐陽中陰氣消亡久病必求左手亦恐陰內陽神欲去故耳即謂神之虛實也非只一心謂五臟之神俱當求於二寸也氣之存亡者亦非只脾胃謂五臟之氣俱當求於二關也此其一義余可類推又如散脈多浮乃神欲去也弱脈多沉乃精耗竭也弦脈多中乃氣無生理也至於感冒脈浮非神病也因氣鬱而現於外自出其本部耳吐瀉而脈伏緣氣泄而隱於內自退其本位也即精神亦有進退宜仿此義大凡五精涸竭脈沉而數五氣衰微脈中而弦五神飛越脈浮而散此皆危候若浮而軟神不足也沉而細精不足也中而虛氣不足也其變見之不同者亦可由李瀕湖之二十八脈以參之但必圓活不宜執滯則無不可今豫立三才貫五行之論恐人拘泥古法不能盡得病情耳姑再詳言之今人寸脈沉軟皆曰心虛殊不知亦精虛也尺脈浮軟皆曰腎虛殊不知亦神虛也即寸尺之脈中而軟亦當以氣衰斷之此活法也凡三部神虛治補本臟猶必兼於補心三部精虛用滋本陰亦必合於固腎其義詳見藥性疏辨茲不復述然精虛不已則氣亦耗氣虛不已則神亦亡矣故三者又同一源須斟酌其孰急者先治之又不可執其一而遂忘其二也豫論皆本於經義但諸家未有是說故為之備論焉寸關尺部位圖左寸陰神陰中之陽神心即神元神也火焰砂中汞也左關陰氣陰中之陽氣肝氣即生氣魂也生氣也木中滋也左尺陰精陰中之陽精腎水即元精志也先天氣也真精也右寸陽神陽中之陰神肺即魄藏魄也元氣也金中液也右關陽氣陽中之陰氣脾即中氣意也土氣也胃液也右尺陽精陽中之陰精腎火即相火志也先天氣也元精也仿性命圭旨之式圖傍注解皆不用虛字收腳感證鉤玄論感證之始皆緣於天淫六氣人受賊邪隨時發現百出多端治或有差損人天年不可不慎然以理揆之無非風寒暑濕燥火而已其著人也亦不過經絡臟腑苟能隨證施治何致為害但古人立方多屬峻利豫思藥之峻利無窮而人之元氣有限故未敢盡信惟張介賓所謂邪實者暫宜解標邪微者只當求本此言真治感證之準繩活人之寶訓也又創立五柴胡等方分按五行通療感症然其間求本解標並行不悖其意不過言人初感必有外邪故分別為之解散即或需用滋補等藥亦念氣血虛弱之人感邪既深不能徒逐而散所以助其氣血而邪自去矣然病至一七二七之外無問邪之解否視其脈症劇極雖非治者失宜終不可執用成方又必另畫一策高鼓峰云三元虧損土無基遇著庸醫促命期斯言良有以也夫人之土脾胃是也萬物皆生於土而調土之法猶難蓋土燥不生端由水之憊也若土寒冰冽抑非火之衰乎至於土鬱不舒焉能生髮故高氏有三元之論夫三元者即水火土之位精氣神之所聚也絳宮位尊而處上焦元海幽深而列下部黃庭界乎上下而居中州乃人生之大要也故感證屢散而不解者必屬三元虧損真土無基縱邪實邪微而生氣將絶斯時豈可再遇庸醫舍三元虧損之本症而妄攻外感之末邪哉今董西塘之論惟以救胃液為主其論固確然猶有未盡者也夫所謂胃液者乃土無腎水滋潤燥極而不能生故所用皆養陰藥即高氏三元中之一也若夫土鬱不舒非胃陰之枯槁實中氣之閉塞中氣閉塞則諸經絡之氣一時凝滯血脈為之不行心神為之悶絶而死期不待終日矣斯時設用西塘養陰之法非惟無益而反增其膩隔適促其斃耳法當疏氣散郁使中州道路得通則心腎交於頃刻矣何必拘於養陰方交其子午哉又夫中氣本虛胃陰不乏惟緣外邪熾甚火逼絳宮而心神揚越以致土寒冰冽生氣蕭條若此非養陰運氣之藥必以安神收斂之品先救其君君主得明則十二官必無危殆矣明此三例始合高氏之說可拯感證而獲大全大凡感證之脈浮大弦數者居多浮弦舉按有力確屬外邪自宜攻之倘浮而無力防有心神飛越之患中候弦數有力亦外邪也倘或弦微澀數而似郁脈者則是中宮氣塞之病沉而堅實或有積也倘細數而無力者確乎腎水之消亡必用西塘之法以救胃陰為主若非是脈雖舌胎之枯燥不得概責其無水可參神氣二者治之倘因中氣閉塞遽投養陰之藥豈不增其窒礙若或陰液將竭而誤投運氣之劑亦是速彼枯涸耳又如心神散越屢服壯水之方似乎渴而穿井頻服健運之藥勢如火上添油又如水涸火炎雖服安神之品若揚湯而止沸曷如釜底抽薪倘氣悶而神昏縱助心君之力猶焚膏而燭暗孰知啓牖通明若能精研斯理熟記於胸用之無失則不致隨庸醫附和而促命矣徹微論天行六氣之病隨時所發皆名感症非疫癘也夫霜降以後春分以前人感之而病發者名曰傷寒其治法仲景闡詳已備毋庸贅矣若在夏至之後秋分以前人感之而發者又非傷寒疫癘之比其義何也豫聞復卦之陽升自地姤辭之陰降自天此自然之理故凡感發於斯時謂之時氣傷寒者但言其陰不明其義施治乖張坐昧其機時醫概混稱之曰暑風殊不知陰生於上逼陽於下其所感受皆是熱邪是與傷寒不侔本乎天者親上由是心肺並邪上源先傷初非由太陽而始故見頭痛項強者痰火上攻也胸膈脹滿者肝膽拂鬱也又如喉痛頸腫嘔吐譫語者皆陽明受邪也即有別症兼見亦不過另有所挾耳病既不同治亦有異大法於六七日內者急當清心肺之火宣皮毛脈絡之郁屏上源之邪導肝膽之抑俾清肅之令下行則得便水穀之氣四布則得汗不宜以悍劣燥熱之劑復助上焦之邪火而消爍胃中之真陰亦不得以峻削苦寒之品先傷內臟之正氣而招留將陷之客邪試看屢表而外邪不解頻攻而反內陷順者變逆逆者遂亡可不鑑哉若旬日之外邪尚未退上焦閉塞陽明胃火或挾痰食實結胸中法當升提潤下啓其壅滯潤其枯涸亦可便汗而愈不宜用大熱滯氣等藥增益其邪克伐凝寒之類重傷其正此大略也至於察運氣之宜忌究標本之緩急務在臨症之頃心領神會庶無差誤今之治是症者膠執古書而不察其義理究其根由甚至有謂傳經直中之說者徒誇仲景名言有謂涼解直下之說者謬認朱劉真諦均可哂也詎知邪始上焦清之散之為急若入陽明潤之下之為要外邪稍怠即當助正以屏之裡氣暴亡法在回元而後理故凡外邪未散而正氣消亡客火尚存而虛煩復熾或因汗下失宜而變成逆症或自真元虧損而內變遽生諸如此類宜參劉河間治分三焦之辨並鑑鉤玄論之三法酌量以救之可也雖然救急症於須臾諸感本無少異但邪伏清虛之臟非若傷寒之易退也故峻補回元之後仍當解散外邪則無患矣來復論客有問於豫曰證之與傷寒不同既聞命矣然傷寒自太陽經始一日傳一經七日而邪氣傳遍或可汗解至十四日諸病氣衰雖不治亦已至於時感既非傳經之例可推然其愈也亦必七日或十四日以為期其故何也豫曰其義深矣豈能遽悉然司命者不得不窮其理第恐豫之淺識所答未明姑擬一言聊以塞責易云七日來復如子到午之義即太極陰陽之相半也今人既具太極之形體自不外乎陰陽之妙用夫冬至陽生夏至陰生無往而非七日來復之義故陽氣生而四體融和則寒邪自解陰血長而百骸濡潤則酷熱頓除豈必待傳經盡而後病始衰耶客又問曰或十四日而不愈者甚有遷延三七四七之期而仍死者得非陰陽亦有不復之時耶豫曰非也否極泰來其理昭然陰陽豈有間絶但陰陽之氣將復未復之際或其人本元素虛而五內消亡或邪實猖狂中宮竭絶或因攻伐太過正氣暴傷頻散表而陰津致涸屢寒涼而真火逼越勢如新谷未登存糧已罄將救死而恐不贍枵腹垂斃之頃奚暇與邪爭勝負耶客又問曰然則如何退敵豫曰當此之際不必攻擊其邪惟運資升斗之粟急援其飢以俟數日之命自有天然真氣來復所謂終則有始此天心見於易者自有明徵且待正氣稍回再行按證逐邪施治譬之有堅甲利兵然後審機攻守方無失也倘於正氣未復之際不思救其人之危命而妄議攻邪之末策無不殆矣客曰臨危制難料敵設奇將帥之略也醫中之理亦如是夫時疹療元傷寒諸證仲景倡論於前諸賢闡發於後固無餘蘊矣獨時疹一案尚少詳悉未免混淆不可不辨嘗考內經天時氣運不獨嚴冬肅厲之氣為能致害即三時災變之異亦能殺人今見三時感證初起狀類傷寒或見咳嗽心煩顴紅耳赤或見壯熱骨疼發厥等症其脈或洪或數或伏至七八日續發疹子本非重症奈調治失宜往往致殞非氣塞痰迷而絶即汗泄液涸而亡良可憫也間嘗竊揣此證初不過外受六淫之邪內動拂鬱之火及其成證世人皆曰時疹視若非常不投發散即用苦寒遂成敗壞獨不聞傷寒斑疹已見忌服升麻葛根恐傷正氣況羚羊角刺芩連梔柏乎夫邪之所湊其氣必虛苟重於發散津液必枯再用苦寒脾胃必損由是觀之六淫所感其始未必就發斑疹皆緣治乖成法邪踞陽明腎水不能上達心火亢甚凌爍肺金肺受火邪無由疏泄鬱於皮毛而發疹也故凡邪之初感尚在肌腠宜汗宜和引而出之邪入陽明宜潤宜清便而通之至若疹形既露急當調榮養衛助正屏邪其或胸腹病後中氣虧損虛火遊行亦能發疹須用建中在表在裡在氣在血虛實緩急先後次第不可失一如謂疹出六腑六腑屬陽症多實熱故宜發散苦泄盡驅其邪豈知氣壯者被攻猶且遷延時日若氣虛者誤攻鮮有不殞其命甚有見其昏迷痰塞喘急者猶云初起攻透藥輕疹反內陷故致無救不誠誤歟總之將斃之候治同感證宜參鉤玄論之三法以救之惟誤下而致劇者必須重用人參乾薑煎服以拯之更有痰盛欲絶者用導痰湯加人參如毒甚疹色紫黑而欲悶死者必須解毒溫中二法並行始無邪陷之患臨症務宜詳細必得其術為善也觀高士宗治疹之論但云調其經絡和其榮衛虛者補之寒者溫之寒涼攻發概不妄用亦可謂深知治疹之本源矣雜言古人云小不慎必亂大謀天下之事莫不如此醫道亦有之雖非經濟學問之要然司人性命不可不慎也略舉數端言之一曰不可易二曰宜乎變斯二者誠小事中之大謀不可不明者也孔子云人而無恆不可以作巫醫易云不恆其德或承之羞皆此謂也而醫士之恆有三一曰恆德凡遇貧賤之人當存救濟之心勿因其簡慢無酬而怠忽勿因其卑陋無禮而遂棄見彼以苦切之情相告當以寬裕之說慰之見彼藥食之需難周當以隨力資助之總之貧富不分惟命自重若此者所謂仁以為已任也故謂之曰恆德二曰恆理凡臨症擬方則當持其自知之理不可因事而忽變也如見頭痛身熱不可竟謂其感脈弱氣衰不可便斷為虛炎蒸暑熱勿疑桂附難投冰凍雪凝休道硝黃可廢從舍之法一如景嶽之辨可也及如他人已補我診該攻何必懼前而束手彼醫欲攻我診該補豈堪畏後而先拘勿以病人喜暖而遂投溫藥傍人慎火而竟用寒涼惟我不為所惑必以察脈主治攻補隨施若此者又當因事而變之也故謂之曰恆理三曰恆情凡用藥須要因時制宜故古法不可拘泥當隨時而酌用之易有貞凶貞吝之辭戒時勢之不可不變耳君子豹變而民革面以從之詩云周雖舊邦其命維新傳曰日新之謂盛德皆變之謂也今人往往不能終其天年而夭折於病或又不死於病而多死於藥豈不哀哉大凡草藥單方舉世信之倘服不對證一害也又或隱病諱而不告醫者二害也又不能真知其理適有對症之方妄自增減三害也親朋薦醫雄黃鼓舌朝張暮李功咎罔知四害也至若市中購藥真贋莫辨貴賤分量一任枝梧五害也倘有高明仁德之士有感豫言必須明告病家正言雄辨以杜其害故謂之曰恆情今豫識雜言欲使世之業醫者信三恆之說更期業無作輟慎小成大將見古道中興世無橫夭於天地好生之心不無一得焉題石室祕録古人言醫自黃帝迄今其書奚止充棟何曉曉而不憚煩耶蓋緣天運逐數遷移故因時制宜者誠不得不因時適變良由天不自鳴擇其善鳴者假之鳴耳山陰陳遠公先生著有祕録一書列法三百餘條論症悉遵古義制方頗合時宜殆今之所謂善鳴者奈何盡托諸先賢降筆遂使智者貽譏愚者莫信意者濟世心迫因特假神奇以驚世俗歟夫荒唐詭譎之說使人可玩而不可由何先生竟出於此耶且天既擇人而鳴於古又何難擇人而鳴於今乎其能使古人之鳴而直鳴於今又安知不能使今人之鳴而繼鳴於古耶遠公何不量之甚哉吾聞聖人不以人廢言遠公雖昧立言之道其於醫學煞有可取卷中如內傷之症險危之病其救法甚為允當起死回生如槁得露苟參其論察其方較勝邯鄲遺稿何異立齊醫案業是科者正不妨由此假道殊不必拒之甚絶之深也夫羹牆之見彈琴之遇聖人言之則遠公神遇先賢亦非怪事但不得竟托之古人而鑿其說自欺以欺人嗟乎斯祕録之不行其孰使之然耶豫為此言非惜遠公之書不行而特惜世之不能用其書今之紛紛為遠公疑者曷亦取其書而熟復之始信豫言不謬遠公有知寧亦以豫為知己也耶附録西塘論治感證大法董廢翁曰愚按治感證大法始終照管胃中津液為第一奧旨蓋邪所感皮毛閉塞氣不外達鬱而成熱熱積皮毛不解漸而肌肉熱矣漸而各經絡無不熱矣漸而熱氣皆壅塞陽明腑中熱矣此必然之勢也又況後代血氣未衰早御酒肉厚味胃中素有濕熱者多年將半百血氣漸衰古云五十非肉不飽今人氣壯之時惟縱酒食焉得胃中無濕熱乎一旦客熱交併區區陰津幾何能當此烈焰燎原乎凡感症之死皆由胃汁乾枯是以古人立法及其邪之在表血氣未傷之時當汗汗之所謂開鬼門也欲熱從汗解則清寧安固而氣血全保不傷矣其當邪之在裡血氣漸虧之際可下下之所謂潔淨府也故熱隨便通則焦灼頓除而氣血可徐俟其來復矣其有血氣素虧之人三四五日之後不論表症解與未解里症急與不急一見口乾唇裂舌胎焦黑燥硬全用滋養清涼虛甚者並涼藥勿用純陰重劑加人參數錢升發運用但救得胃中津液不竭其人必不即死及津液漸充汗自能來宿物自下至所謂胃中之津液非他即周身血氣所化積疊胃底此後天之本也凡人平日之強弱及遇外感賊邪之難治易治可治不可治強半憑此粗工不知無論新久虛實表裡苟見身熱風藥混表一覺悶滿攻中破氣亂投不效大黃枳朴繼進必求一便以畢其技能豈慮熱得風而益熾陰被劫而速亡二語是感證致死根苗何其與先賢之意適相反哉茲集所說先後緩急不爽輕重攻補適宜大旨所在總始終照顧陰津以勝邪回生之術二語是感症治法主腦學者由此更遍參先賢之書以盡其精微極其變化則感證之道備而於他症亦思過半矣按西塘治感證之法惟救胃陰為主蓋緣腎水乾枯不能上供陽明之意故所用皆養陰藥耳明眼宗之無不桴應俗工效顰間或反劇輒云鼓峰之書不可信甚有醫林指月中之胡念庵專斥鼓峰不學是皆未明其義夫人身全賴精氣神充足而全活若或損一必無生理故高氏有三元之說三元者精氣神也然腎主藏精董氏獨論滋水以救胃中之津液止高氏三元中之一耳其神氣二者之根由尚未詳悉以致粗工不察漫施無效宜乎病者反受其害今豫著鉤玄論發揮神氣二者之病源以補前人之未發而合三元成全璧臨診之下神而明之則治感之法可獲大全而高氏之書益可信矣記昔吾友吳南陽嘗謂豫曰人若讀書潛心默悟理會貫通書若讀人拘文牽義終老木偶旨哉斯言洵不誣也
