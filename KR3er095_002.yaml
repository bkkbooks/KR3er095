body:
  text: 中卷感證類要傷寒六經正治法太陽太陽發熱與憎寒仲景云太陽之為病脈浮頭項強痛而惡寒頭痛腰疼脊強參或兼嘔惡無汗傷營脈浮緊仲景云脈陰陽俱緊骨節煩疼無汗而喘者名曰傷寒考難經傷寒有五有中風有傷寒有濕溫有熱病有溫病此即素問寒暑燥濕風之五氣為病也故寒傷營亦難經傷寒有五之一素問在天為寒在地為水寒者水之氣也湯宜麻桂杏仁甘麻黃桂枝杏仁甘草即仲景麻黃湯以薑棗引惡風有汗為傷衛仲景云太陽病發熱汗出惡風脈緩者名曰中風手足當溫仔細看風為陽邪故手足不冷脈但浮來還帶緩仲景云陽浮而陰弱嗇嗇惡寒淅淅惡風翕翕發熱鼻鳴乾嘔者桂枝湯主之按難經言脈關前為陽關後為陰素問在天為風在地為木風者木之氣故風乃五氣之一而風傷衛亦難經傷寒有五之一其燥濕暑三症散列各類之中熟讀全論自明桂枝白芍草能安桂枝白芍甘草即仲景桂枝湯用薑棗引溫服隨歠稀粥以助藥力兩傷營衛大青龍此是風寒挾暍中仲景云太陽中風脈浮緊發熱惡寒身疼痛不汗出而煩躁者大青龍湯主之若脈微弱汗出惡風者不可服服之厥逆筋惕肉瞤此為逆也論中發於陽者通名中風發於陰者通名傷寒鼎立三綱疑解誤沈堯封云按三綱鼎立之說桂枝湯治風傷衛麻黃湯治寒傷營大青龍湯治風寒兩傷營衛其說乃創自許叔微相延至今不知其說似是實非也本論云寸口脈浮而緊浮則為風緊則為寒風則傷衛寒則傷營營衛俱病骨節煩疼當發其汗此指麻黃證而言彼見麻黃證條內但云脈陰陽俱緊而不見浮字故認作有寒無風不知寒屬陰邪若不兼風不入太陽況太陽病一句已有脈浮在內不必再說至若大青龍條內云脈浮緊則風寒固所必有矣然使止有風寒何至煩而且躁況方內石膏其性大寒治暍熱之主藥也若云止有風寒而無熱邪則中風證有風無寒風為陽邪尚不用寒藥只用桂枝以解肌而大青龍證風外加一寒邪豈反加石膏以助寒乎竅謂麻黃證已屬風寒兩傷營衛則大青龍證則外傷風寒而內伏暍熱也故脈浮緊發熱惡寒身痛無汗麻黃證全具自用麻黃湯方惟病增煩躁因加石膏以治內伏之暍熱如是則病脈方藥俱合若不審病證方藥徒泥於一脈妄作三綱鼎立則一誤無所不誤矣惟參原論義精通麻黃桂枝甘草杏仁石膏即仲景大青龍湯薑棗引陽明陽明傳腑與傳經仲景云陽明之為病胃家實也此在內之證據又云濈濈汗出日晡潮熱此在外之證據如內外相合即仲景所謂正陽陽明也其餘或兼少陽故仲景書中有少陽陽明之論是以正陽陽明主以大承氣湯治之如少陽陽明以大柴胡治之腑脈須知沉實論潮熱妄言或便閉渴尤惡熱汗尤蒸黃斑狂亂同相見白芍柴黃枳半芩白芍柴胡大黃枳實半夏黃芩即仲景大柴胡湯以薑棗引經脈微洪亦要明鼻乾目痛熱難寢目鼻者足陽明胃所布之經絡也經云陽明之脈起於鼻交額中旁納太陽之脈連目眥下循鼻外入上齒中挾口環唇邪氣傳之則目痛鼻乾至於他經各行其道何目痛鼻乾之有柴胡葛根芩甘桔芍芷羌膏薑棗平柴胡葛根黃芩甘草桔梗白芍白芷羌活石膏薑棗引即陶節庵柴葛解肌湯柯韻伯云陽明之病在胃實當以下為正法矣然陽明居中諸病咸臻故治法悉具如多汗無汗分麻黃桂枝在腑在腹分瓜蒂梔豉初硬溏燥分大小承氣即用汗吐下三法亦有輕重淺深之不同也若大煩大渴而用白虎瘀血發黃而用茵陳小便不利而用豬苓停飲不散而用五苓食谷欲吐而用吳茱等法莫不各有差等以棋喻之發汗是先著湧吐是要著清火是穩著利水是閒著溫補是急著攻下是末著病至於攻下無彆著矣故汗之得法他著都不必用其用吐法雖是奇著已是第二手矣他著都非正著惟攻下為煞著亦因從前之失著也然諸法皆因清火而設則清火是陽明之上著歟少陽少陽口苦咽乾嘔仲景云少陽之為病口苦咽乾目眩也寒熱心煩弦脈推目眩耳聾並脅痛仲景云正邪分爭往來寒熱胸脅苦滿默默不欲飲食心煩喜嘔或煩而不嘔或腹痛痞硬或耳無所聞或心下悸或小水不利或渴或不渴或咳者又云傷寒中風有柴胡證但見一證便是不必悉具此指上文或字而言也小柴參草夏芩陪人參柴胡半夏黃芩甘草即仲景小柴胡湯以薑棗引按邪犯少陽乃半表半裡之病故仲景擬定小柴胡湯以和解表裡之邪並非表散之藥也常有不明之病家見用柴胡而深畏之醫者復順其意易以羌防芎葛耗其津液致死不救伊誰之咎歟太陰太陰腹滿常腹痛仲景云太陰之為病腹滿而吐食不下自利益甚時腹自痛若下之必胸下結硬食不下咽吐益湧喻嘉言云腹痛自利太陰之本證也吐而食不下則邪迫於上利甚而腹痛則邪迫於下上下交亂胃中空虛此但可行溫散設不知而誤下之其在下之邪可去而在上之邪陷矣故胸下結硬與結胸之變頗同胃中津液上結胸中陽氣不布卒難開也自利臟寒口渴無仲景云自利不渴者屬太陰以其臟有寒故也當溫之宜四逆輩喻嘉言曰注謂自利不渴溫之也故用四逆輩以燠土燥濕此老生腐談非切要也仲景大意以自利不渴者屬太陰以自利而渴者屬少陰分經辨症所關甚鉅蓋太陰屬濕土熱邪入而蒸動其濕則顯有餘故不渴而多發黃少陰屬腎水熱邪入而消耗其水則顯不足故口渴而多煩躁若不全篇體會徒博註釋之名其精微之蘊不能闡發者多矣程郊倩曰三陰俱寒臟少陰厥陰有渴症太陰獨不渴者以其寒在中焦與龍雷之火無涉少陰中有龍火底寒極則龍升故自利而渴厥陰中有雷火故有消渴太陽一照雷雨收聲故發熱則利止見厥複利羅紫尚曰渴與不渴之辨喻程二說雖各不同均有至理學者宜並參之沈堯封云自利者不因攻下而自利也凡利津液下注外症多渴其不渴者屬太陰之寒病也以不渴兩字認太陰此是辨寒熱利之金針常須識此勿令誤也宜溫四逆湯投送附子乾薑甘草即仲景四逆湯腹滿時疼吐利無醫家誤下變沉疴沈堯封云此但腹滿時痛而無吐利症且本非太陰病從誤下太陽得來故可加芍藥加大黃否則溫之猶恐未效而可寒之乎桂枝白芍大黃草枳實柴胡薑棗扶即桂枝加大黃湯仲景之方也陶節庵參以加減少陰少陰踡臥引衣裳仲景云少陰之為病脈微細但欲寐也俞嘉言云陽脈滑大陰脈微細外邪傳入少陰其脈必微細而與三陽之滑大迥殊衛氣行陽則寤行陰則寐此少陰之總脈總證也口燥增寒亦是常沈堯封云少陰腎脈也真陰真陽寓焉陽虛則陰受寒陰虛則易中熱第陽既虛矣而復受寒則微陽有立亡之勢陰既虛矣而復傷熱則微陰有立竭之虞故辨症既明治不宜緩又云但欲寐症有極寒極熱之邪在裡為患倘未形諸外者當於口中和與燥辨之尤為易見脈若微洪傳裡熱仲景云脈若沉數宜黃連阿膠湯汗需白虎要斟量石膏知母甘草麥冬粳米即仲景白虎湯脈沉必兼微細直中真寒候藥必溫經四逆湯方見太陰條下厥陰厥陰氣上撞心胸仲景云厥陰之為病消渴氣上撞心心中疼熱飢不欲食食則吐蛔下之利不止消渴心疼熱氣衝飢不能蛔上吐往來厥熱利因攻仲景云傷寒厥四日熱反三日復厥五日其病為進寒多熱少陽氣退故為進也烏梅丸主長沙秘烏梅黃連乾薑桂枝細辛附子人參黃柏蜀椒當歸以飯加蜜搗丸此即仲景烏梅丸熱少厥多終屬凶仲景以為病進終難治也沈堯封云此正邪分爭一大往來寒熱病也厥深熱亦深厥微熱亦微猶言寒重則發熱亦重寒輕則發熱亦輕論其常理也其有不然者可以決病之進退矣故下文即論厥少熱多厥多熱少不知注傷寒者皆以熱字作伏熱解遂令厥陰病有熱無寒矣不思烏梅丸是厥陰主方如果有熱無寒何以方中任用薑附桂辛椒大辛熱耶蓋厥陰為三陰之盡病及此者必陰陽錯雜況厥陰肝木於卦為震一陽居二陰之下是其本象病則陽泛於上陰伏於下而下寒上熱之證作矣其病臟寒蛔上入膈是下寒之證據也消渴疼熱撞心是上熱之證據也況厥者逆也下氣逆上即是孤陽上泛其病多升少降凡吐蛔氣上撞心皆是過升之病治宜下降其逆上之陽取內經高者抑之之義其下之之法非必硝黃攻克實熱方為下劑即烏梅丸一方下法已具方中無論黃連烏梅黃柏苦酸鹽純陰為下降即附子直達命門亦莫非下降藥也下之而陽伏於下則陰陽之氣順而厥可愈矣倘誤認厥為外寒所束而反發其汗則心中疼熱之陽盡升於上而口傷爛赤矣以表藥多升而厥陰之脈環唇內也病形煩滿囊兼縮內經熱病論有云傷寒六日邪傳厥陰舌卷囊縮水漿不食昏不知人三日死變幻多端沉脈詳按之有力湯用大柴胡可解此乃陶節庵傷寒六書中之煞車錘法也方見陽明條下六經分治要相當以上六經不過錄其提綱言其主治大概之意至於傳變各證須參後類列條下之法乾隆己丑歲嘉善沈堯封先生編有傷寒卒病論讀一書指出本論仲景自辨疑似以頭痛胃實等項分六經即以渴字辨燥熱小便不利認濕氣汗字判風寒縱橫辨察任其一氣專至數氣並至總無遁情矣復隨文勢逐條註釋較勝方有則喻嘉言程扶生程郊倩柯韻伯五家闡發仲景之秘者更覺顯然明白業是科者必須熟讀並將五家之書暨王晉三古方選注日置案頭並取劉河間朱丹溪張子和李東垣諸明哲之論互相參考得使臨診無誤方不愧於司命之職勉之勉之感證傳變病似相同治法有別感證即所謂傷寒症也古人以霜降以後春分以前直感寒邪者名之為傷寒今統四時通行之症言之謂之感症但傷寒六經之症如上法治之愈矣顧有諱疾忌醫之病家及昧經誤人之庸技日久遷延變如蝟起猝難措手蓋傷寒之症有陰陽表裡之不同人之感者有虛實新久之各異而病之見也有本症變症兼症之殊致今將傷寒本症列於前變症兼症匯於後而一症之中又分攻補之兩途以便業是科者之觀覽茲用集方治撰成歌訣更便學者易誦而易記耳陰陽無熱惡寒病發陰惡寒發熱是陽經陰期六日陽期七數定陰陽病愈辰仲景云病有發熱惡寒者發於陽也無熱惡寒者發於陰也發於陽者七日愈發於陰者六日愈以陽數七陰數六故也天以陰陽五行化生萬物陰陽五行和則能生物陰陽五行乖則能殺物是論乃統論陰陽五氣之病人然五行一陰陽也故未論五氣先論陰陽首節辨陰病陽病之大綱大浮數動滑陽稱沉澀弱弦微是陰陽症見陰終必死陰逢陽脈可回生問曰脈有陰陽何謂也答曰凡脈大浮數動滑此名陽也沉澀弱弦微此名陰也凡陰病見陽脈者生陽病見陰脈者死此亦辨傷寒之脈若他症不可遽斷為生斷為死也陰似陽兮煩躁赤赤是面紅咽疼口渴身猶熱小清大泄即二便睡兼狂浮大脈雖浮大按之必空沉絲脈或沉細無神指甲黑昏黯之色陽似陰兮指甲紅昏迷便秘肢猶厥此謂熱厥傳曰熱深厥亦深身寒反欲去衣裳仲景云病人身大熱反欲得近衣者熱在皮膚寒在骨髓也身大寒反不欲近衣者寒在皮膚熱在骨髓也此辨內陰外陽內陽外陰病之變態脈但來時沉滑力陰必當溫四逆真武理中之類陽必清涼膈白虎黃連解毒之類玄微奧理須當識陰陽兩證治分冰炭寒熱誤投斃命頃刻兩感兩感相傳合併稱仲景有合病並病之論裡虛兼挾外邪侵喻柯各闡長沙秘喻嘉言著尚論篇柯韻伯著來蘇集二書各有精義凡學醫者宜並參之妙義錢楨論益深景岳門人錢楨論曰兩感者本表裡之同病似皆以外感為言也而實有未盡然者正以內外俱傷便是兩感今見有少陰先潰於內而太陽繼之於外者即縱情肆欲之兩感也太陽受傷於裡而陽明重感於表者即勞倦竭力飲食不調之兩感也厥陰氣逆於臟少陽復病於腑者即七情不順疲筋敗血之兩感也人知兩感為傷寒而不知傷寒之兩感內外俱困病斯劇矣但傷有重輕醫有知不知則死生系之或謂兩感症之不多見者蓋亦見之不廣而義有未達耳其於治法亦在乎知其由而救其本也此言最切此病誠發前人之未發深足指迷不可不錄吐血冬感外寒束內熱脈來浮緊吐紅血此緣陽氣不得發泄所致或兼咳嗽吐衄實是外感非內傷七情之紅症也麻黃醋炒湯內配參耆再加麥冬五味白芍當歸去杏仁同煎服爰謂虛人難發泄只為病人平素虛怯難任麻黃之峻散故加參耆以助元氣如或陰虧者可加熟地紅汗熱深無汗來紅汗奪汗者無血奪血者無汗若得汗則無衄症矣升麻四物丹芩散四物去川芎夫升麻一味加得尤妙蓋陽明之脈絡鼻是經火盛迫血妄行從鼻出者曰衄方書言從肺來非也若非升麻則何以達陽明而清其火哉若還衄後病反劇劇者盛也更傷其陰大為危候必須都氣芍生地六味湯加五味子即是都氣飲血來太多要補陽麥冬五味慮虛火上浮故用此補血湯當加人參甘草炙黃耆一兩當歸三錢即補血湯胃實無傷的系熱診果相火上炎自可導下宜投滋腎丸桂心知柏蜜丸良黃柏知母各二兩俱酒洗焙乾為末配桂心二錢研勻蜜丸名滋腎丸的系熱邪有升無降者用滋腎丸以淡鹽湯送下三錢應手即止多有得生者凡或牙宣血湧不止服藥無效審系相火飛騰亦可順導即投此丸亦可見效畜血小腹脹滿小便利即仲景所謂小便自利其人如狂者血證諦也或有嗽水不欲咽者然必以小便為驗熱入血室男女異男女皆有血室但證犯各異女子亂經似結胸在女子則月信適來適斷其形如作狂其血必結如結胸狀或刺期門隨愈穴在奶下一寸三分小柴湯內加歸尾再加生地紅花尤妙男人譫語下血狂然血自下邪解為吉頗有下後即死者但血來必驟而多發黃鬱熱所致承氣桃仁擬桃仁大黃芒硝桂枝甘草即仲景桃核承氣湯或參犀角地黃湯生地丹皮犀角白芍即局方犀角地黃湯邪犯心胸畜血比按此邪犯心胸不獨下症有之亦兼有吐血者應比照足陽明胃家血畜之例亦主以犀角地黃湯治之口渴邪傳裡渴屬陽明汗淋白虎配人參或加花粉葛根麥冬無汗縱渴忌與白虎甚者大柴胡承氣下之此乃陽明之本病是也腎虛火動渴欲飲十全大補八味症四君四物即八珍湯再加黃耆肉桂即十全大補湯六味丸加附子肉桂即八味丸此症亦有水虧不能配火而火炎於上者當從六味左歸以滋其陰而火自能降矣陰虛煩躁渴不飲口雖渴不能飲水也冷服四逆湯須穩附子乾薑甘草即仲景四逆湯此等症候最易混入白虎症倘若認錯一或誤投死生立判臨診之際當細心體察慎毋忽略也渴如食少胃宜和白朮茯苓主之若用寒涼病不瘥四君補中合生脈其效尤捷內傷元氣渴因虛守補自然病得祛脾胃元虛舌雖干須陽藥為主佐以歸杞熟地五味不得以正陽陽明治渴欲飲水頃即吐吐後復求仍若故此腎傷寒醫莫驚晾冷白通豬膽助此是陰盛格陽腎經傷寒之症仲景以附子乾薑蔥白名白通湯加人尿豬膽汁熱藥冷探之法一服即愈女人多此症系屬少陰經病中氣虛寒逼火浮渴欲引飲燥咽喉上焦一段因思水中焦見水是仇讎此中氣虛寒寒水泛上逼其浮游之火於咽喉口舌之間渴欲引飲得飲不過一二口即厭少刻復渴飲亦不過若此此蓋上焦欲得水救至中焦則以水見水正其所惡也面紅煩躁太陰症理中麥味兩相投人參白朮乾薑甘草即仲景理中湯此症系屬太陰經病甚者兼吞八味丸過飲涼水病已瘳手指足縫水旋流腳趾還防齊脫落手指足縫出水俗云脫腳傷寒是也快投妙劑始無憂石室秘錄云速投米仁三兩茯苓二兩桂心一錢白朮一兩車前五錢名驅濕保脫湯一連十劑永無後患譫語胃中熱甚上乘心心為熱冒則神昏語言謬妄二便澀白虎宜兼承氣行脈來洪數有力方可感證如經六七日熱甚便堅胸滿結發狂又且語兼譫潤燥滋陰湯最的此用白虎承氣之準的歌曰潤燥滋陰瓜蔞霜二地芩知竹葉姜麥冬甘草連膏芍枳樸雲苓蘆汁勷脈若細微或洪數按之無力神不守舍語言錯藥用參耆歸術湯附子理中皆可活敗症往往有此誤投解毒等劑立斃是症常見手足厥冷者汗出身和若妄言胃中津液未和間非陰非陽慎莫下小柴合半建中煎汗後身和之詀語乃津液未和所致不得誤認陽明實邪若投攻下之劑必致難救肉桂白芍甘草飴糖即仲景建中湯合小柴胡各半貼和營衛通津液病後精神若未全夢中譫語失聲言不繫詀語鄭聲其狀如魘六君湯中加歸芍人參白朮茯苓甘草半夏陳皮即六君子湯營衛調和方可痊自利傷寒自利不因攻俗言漏底傷寒是也紅黑青黃利下的顏色熱證宗溏鶩為寒脈沉細大都瀉利完穀不化色不變有如溏鶩或吐利腥臭小便澄徹清冷脈或微遲然皆無力身熱惡寒踡臥同踡臥身彎不能直睡也或手足逆冷然口無燥渴下如垢膩小便赤或澀而不利浮弦洪滑多為熱皆兼數而有力方是熱症亦有熱邪穀不化熱邪太甚不能殺穀其物不消化者有之須參脈證治無差臍下寒臍下熱寒毒入胃者臍下必寒協熱利者臍下必熱或兼驗小便寒用理中寒甚加附子或白通湯加附子熱芩別黃芩白芍大棗甘草即仲景黃芩湯熱利宜之協熱注泄白頭翁白頭翁黃連黃柏秦皮即仲景白頭翁湯以寒下結通因通有內熱火結注泄不止者須以寒藥下之結散而利自止正所謂通因通用也胃虛內熱煩渴瀉脈微脈弱需七味四君加藿香煨葛根煨木香再配煨姜即七味人參白朮散若發熱須用芩連俱酒炒和三白四君去人參加白芍即三白湯若作嘔藿香廣半廣皮半夏生薑湊腹滿腹脹與腹疼小水不利需五苓茯苓白朮豬苓澤瀉肉桂即仲景五苓散脹加厚朴薑汁炒疼芍桂白朮木香隨症溫經云暴注下迫皆屬於熱此條諸法蓋推之以盡其變耳若非審有是症則不得概用溫燥之劑脈浮未解小青龍麻黃桂枚白芍甘草半夏乾薑五味細辛即仲景小青龍湯散表邪兼治水工凡傷寒作利脈浮表未解者即仲景以小青龍湯去麻黃加芫花二錢炒令赤色蓋散表邪以兼治水也故知凡症皆不可執一說以概其餘濕毒氣盛便膿血地榆歌曰犀葛榆連共芩梔薤白加即地榆散連膠法更融阿膠黃連黃柏山梔即黃連阿膠湯失表失下致嘔利太凡嘔少利多生薑瀉心湯可從人參甘草黃連黃芩半夏乾薑大棗即仲景半夏瀉心湯加生薑是也按口渴譫語自利本陽明太陰之症緣六經只列陽病而不及陰症又無救敗之方今此陰陽壞症俱具則正所謂病之變也腹不大滿藥下之利遂不止藥難使認明寒熱治須分解毒溫中醫作主上條因失表失下以致利此則因誤下而得利而誤下後之利又有寒熱不同法當分治如此可見辨症宜精晰也太陽或見脈浮頭項強痛惡寒陽明或胃家熱或見潮熱合病來仲景云合病者必自利葛根湯主之即桂枝湯加葛根是也桂枝加葛利能開開者自開玄府寒散而利自止也自利若合太即太陽脈症具前少陽或口苦或見寒熱嘔芍棗黃芩炙草方即仲景之黃芩湯少陰之症但欲眠凡少陰之證必見多寐初起吐汗不煩言迨後利止並複利躁眩時冒入黃泉此必汗下已極而亡陽但脈必短或有譫語津干液涸陰精已竭死又何疑仲景云少陰病下利止而頭眩時時自冒者死喻嘉言曰下利既止自可得生乃頭眩時時自冒者復為死侯蓋人身陰陽相為依附者也陰亡於下則諸陽之上聚於頭者紛然而動所以頭眩時時自冒陽脫於上而主死也可見陽回利止者生陰盡利止者則死矣三五日後腹遂痛便溏不止小便艱若帶膿血桃花主恐陽明有開無合陰氣下泄故主此方固陰氣赤石乾薑粳米全此三味即仲景桃花湯仲景云少陰病二三日至四五日腹痛小便不利下利不止便膿血者桃花湯主之喻嘉言云腹痛小便不利少陰熱邪也而下利不止便膿血則下焦滑脫矣滑脫即不可用寒藥故取乾薑石脂之辛澀以散邪固脫而加粳米之甘以益中虛蓋治下必先中中氣不下墜則滑脫無源而自止也注家見用乾薑謂是寒邪傷胃欠清蓋熱邪挾少陰之氣填塞胃中故用乾薑之辛以散之若混指熱邪為寒邪寧不貽誤後人耶咽痛胸滿心煩苦少陰下利必有見此諸證仲景云少陰病下利咽痛胸滿心煩者豬膚湯主之喻嘉言云下利咽痛胸滿心煩少陰熱邪充斥上下中間無所不到寒下之藥不可用矣又立豬膚湯一法以潤少陰之燥與用黑驢皮之意頗同若以為燖豬皮外毛根薄膚則逆劣無力且與熬香之說不符但用外皮去其肉層之肥白為是此藥大不可忽陽微者用附子溫經陰板者用豬膚潤燥溫經潤燥中同具散邪之意比而觀之思過半矣白粉豬膚共蜜煎此三味即仲景豬膚湯厥陰之證初不利忽然大下熱反劇汗出不止近死期腹脹身痛四逆理用四逆湯先救其里次攻其表桂枝湯此是前賢玄妙秘先里後表之法須讀仲景全論自明利後心煩按且軟胸膈必軟梔子淡豉病可轉此二味即仲景梔子香豉湯心下痞時醫誤攻痞是寒邪與無形之氣磐結下利不止與理中理中者理中焦之氣兼散寒邪反甚禹余加赤石禹餘糧赤石脂二味以飯丸服不應須將小便通金匿腎氣五苓之類喘滿直視譫語利胃火焚心欲脫氣譫語者心火亢極也加以直視則腎水垂絕心火愈無制故主死也喘滿者邪聚陽位而上爭正不勝邪氣從上脫故主死也下利者邪聚陰位而下奪正不勝邪氣從下脫故主死也陳遠公云喘滿直視譫語下利一齊同見者故當主死若有一症未見者猶可望生宜投挽脫湯竹茹羔芍揀門冬重配人參方克濟石膏五錢人參一兩麥冬一兩白芍一兩竹如三錢名挽脫湯此乃欲脫未脫之危症故重用人參以救脫石膏以平火麥冬以定喘芍藥止利竹茹清心服之自然氣不絕而可得生也蓋此方貧者斷不能備或豪貴之家自可措辦姑錄之結胸結胸痞滿要分明結是陽兮痞屬陰脈若浮來休誤下仲景云結胸證其脈浮大者不可下下之必死汗過痞脹氣虛增津液搏塞惟疏滌津液搏結陰氣內動壅而為滿主以益胃和脾降氣滌飲為治厚朴生薑及夏參少陽證具痞不痛寒熱必有嘔熱還宜夏瀉心人參甘草半夏黃芩黃連乾薑大棗即仲景半夏瀉心湯服後不和煩渴躁仲景云本以下之故心下痞與瀉心湯痞不解其人渴而口燥煩小便不利者五苓散主之小水如無用五苓茯苓豬苓澤瀉白朮肉桂汗出熱來痞不解仲景云傷寒發熱汗出不解心下痞硬嘔吐而下利者以大柴胡主之嗢嗢吐利大柴行喻嘉言云外邪不解轉入於裡心下痞硬嘔吐下利攻之則礙表不攻則里症已迫計惟主大柴胡一湯合表裡通解之耳小結胸按則痛喻嘉言曰胸既結矣本當下以開其結然脈浮大則表邪未盡下之是令其結而又結也所以主死此尤一病不堪再誤也脈來浮滑小陷胸黃連瓜蔞半夏薑棗即仲景小陷胸湯熱實結胸脈沉緊按之如石大陷攻大黃芒硝甘草即仲景大陷胸湯無熱結胸名水結頭汗微微治亦同桂枝茯苓白朮湯主之不能臥但欲起心下痞結嘔短氣此未經攻下之痞結仲景云脈微弱者本有寒分也濈濈汗出里未和痰阻清陽十棗諦膈以上象天清陽所聚膈以下象地濁陰所聚故心下結硬其病尚在膈上皆由痰飲阻滯清陽之氣使然非食物停滯也十棗湯方芫花熬甘遂大戟等分別搗為散以水升半大棗肥者十枚煎取八合去渣納藥末壯者一錢弱者五分平旦溫服若下少病不除者明日再服加半錢得快利後糜粥調養身發熱微惡寒肢節煩疼略嘔看心下偏旁渾是痞名為支結桂柴參仲景傳解條云傷寒六七日發熱微惡寒肢節煩疼微嘔心下支結外證未去者柴胡加桂枝湯主之如果下早成結胸桂枝加參合理中未經下者症雖滿悶尚為在表非結胸也此因下後虛逆寒氣獨結而毒復上攻氣毒相搏結於胸者雖痛而無煩躁等症宜理中湯加枳實茯苓太陽結胸煩躁悶陳遠公云太陽結胸證具煩躁者主死言不可下即下而亦死也夫結胸而加煩躁此胃氣之將絕也胃氣將絕津液枯涸心無所養故見是症為不可治也雖然津液之竭非五臟之自絕亦因結胸之故耳是必攻其中堅使結胸症愈而津液自生死症可望重蘇矣化結之湯推妙用花粉五錢神麯麥芽天冬桑皮各三錢枳殼一錢陳皮五分即名化結湯水煎服一劑結開而液生矣此方用花粉以代瓜蔞不致陷胸過猛枳殼消食寬中麥芽與桑皮同用而化導更速神麯陳皮調胃天冬生津液佐花粉有水乳之合故能化痞化食有勝於陷胸之峻也凡病人素有飲誤下胸滿痞煩增小便如艱譫語甚轉側維難身重評凡素挾飲之人太陰本虛適或外邪宜從疏解今誤下之有傷少陽樞機表裡俱病脈或有力還從表裡並治小柴去黃芩龍牡龍骨牡蠣鉛丹即飛丹主桂枝苓配大將軍即製大黃一名將軍即仲景柴胡加龍骨牡蠣湯脅間素痞繞臍庭痛牽小腹入陰筋小腹之旁有筋硬痛人靜舌胎惟白滑臟結無陽死症形此陰邪結於陰也多致不救惟陳士鐸云速投散結救臟湯可十救二三方用人參一兩白朮五錢甘草一錢附子一錢當歸五錢肉桂五分壯若結胸食似常其飲食如常時時下利寸浮詳脈狀如此關中細小並沉緊白滑胎形命亦亡或舌左邊白胎叢起名曰雪花胎乃脾閉之象亦所謂臟結以上二症治法互參雖與溫中邪可散人參附子斷不可少必須胎退保無妨若胎不退或退而復起終必死也頭不疼項不強寸脈微浮桂枝樣狀似太陽中風症痞硬心間氣上衝咽喉不息胸寒狀仲景論中無痰字此寒字作痰字解是症乃寒邪挾痰結於上焦脈如乍緊胸中滿厥冷心煩邪結戰高者越之古秘方吐法無疑瓜蒂貫以上兩症須要互參甜瓜蒂赤小豆各一分炒黃為末即名瓜蒂散香豉一合生搗煎汁調服得快吐乃止仲景云諸亡血虛家禁之傍流微熱神昏微渴干便溏大便溏泄時至此謂旁漏乃熱結於中逼注大腸非關脾也舌燥色豬肝或殷紫色養血滋陰合白虎養血滋陰乃生地當歸之類此症須加黃芩旁流得止便才安止後數日得正便而方愈小便閉時須解熱熱解自通莫性急木通若並車前利易竭陰陽無救訣先哲云自利之症如若發汗則內外皆虛此症亦云利水則陰陽易竭俱是不刊之論如熱甚失汗下舌燥唇焦且莫呀小便赤而大便堅時有稀糞水利出者此內有燥矢結聚乃旁漏之物非冷利也再審有矢氣極臭者是也再審脈沉或力滑其脈雖沉切之必滑而有力或時躁熱不欲衣被或揚手擲足或譫語有力此陽氣亢極人參白虎小柴胡再合黃連解毒湯主之黃連黃芩黃柏梔子原方止此四味相傳此方為太倉公火劑而崔氏治劉護軍又云其自制者皆不可考內熱實潮還可下大柴胡加芒硝主之歌曰白芍柴黃枳半芩厥逆初熱頭疼久便秘手揚擲足昏譫語此為陽厥甚參微此乃邪熱抑伏不達則煩躁不寧時或昏憒四肢厥冷經所謂熱深厥亦深矣大小柴胡承氣取看微甚酌下之四肢厥逆脈細沉惡寒下利此為陰或引衣蓋覆不欲飲水或下利清穀指或微寒脈不至此陰陽之氣不相順接使然理中四逆望回生四逆加蔥莖即名通脈四逆湯如腹痛去蔥加白芍嘔加生薑咽痛去白芍加桔梗利止脈不出者加人參內有久寒兼少血當歸四逆吳萸的當歸通草桂枝甘草白芍細辛生薑大棗即仲景當歸四逆湯此症再加吳萸歌曰當歸四逆生薑棗通草細辛芍桂甘煩躁肌寒吐利兼手足厥逆肌膚亦冷喘促脈伏吳茱益人參吳茱薑棗即仲景吳茱萸湯寒熱厥色不澤忽然冒昧手無脈邊有邊無綿可包麻黃各半湯汗得症必寒熱而厥面色不澤冒昧之際兩手忽無脈或一手無脈必自有正汗也多用綿衣裹手足服五味子湯氣壯者兼服麻黃桂枝各半湯須臾大汗而解生脈飲加杏仁陳皮生薑大棗即是五味子湯病者還言不結胸按之小腹隱疼攻手足逆寒渾似厥冷結膀胱法灸通宜關元穴灸之穴在臍下一寸三分厥逆凡如灸不回人參不用可扶危此為貧者畫策姜附炮薑附子三星各三錢術四兩白朮東壁土拌炒焦一劑能蘇法永垂乃石室秘錄所傳奇治法發喘氣喘抬肩宜汗表肺主氣肺氣逆而上行沖沖而氣急喝喝而息數張口抬肩搖身滾肚是為喘也有表症者宜汗然心腹必濡軟或飲停胸用五苓此病人劇飲水致停飲心下結滿而喘者葉天士云五苓散去肉桂加桂枝自開太陽之腑亦仲景和表裡之法喘而汗出脈促者邪氣內攻故脈見促宜利之葛根黃連湯草芩仲景之法汗出而喘無大熱杏膏麻黃薑棗平即仲景麻杏石膏湯之法發之之意蓋病與脈氣皆未虛耳而喘亦是微勞碌感寒醫誤投凡勞碌之輩裡氣定虛復感寒邪身必發熱醫不審察誤投涼藥遂變大喘遂致大喘汗如油診之脈若加浮軟人參五味麥冬儔即生脈散須重用喘乃定膈中煩熱滯不行喘促咽乾瀉白論或渴者加減瀉白散主之歌曰桑桔瓜蔞芩二母橘紅甘草骨皮勷熱甚有痰脈弦數小柴知貝與蔞仁凡胸滿加枳殼桔梗下滿加枳實黃連舌燥飲水而喘者加石膏下後大喘邪傳裡則為裡氣大虛邪氣復傳裡也黃連葛根湯當與黃連葛根黃芩甘草即仲景葛根黃連黃芩湯潮熱氣短不大便凡陽明內實腹滿氣短而喘者乃傳經里症內熱閉結大便不通熱氣上衝致肺金清肅之令不得下行因而喘急此是胃熱攻肺故可下之俾其熱氣流通而喘定矣然或有惡寒等症則不可遽攻恐成逆候大柴樸杏憑加減仲景大柴胡湯加厚朴杏仁下後微喘氣逆行則為邪氣上逆乃邪不能傳裡猶在表也桂枝湯表樸杏仁桂枝湯解表樸杏下逆氣陰厥脈微無汗喘陰症厥逆脈沉細而微氣促而喘無汗者四逆還加杏味平四逆湯加杏仁五味子虛人脈伏冷四肢五味子湯尚可持生脈散加杏仁陳皮是也勞力外感脈微細按之或空身不炮熱喘兼瀉身亦微微而熱大便不過帶溏咳痰氣促吃粥少忽然汗出死誰替仲景云傷寒脈虛身熱而喘急下泄汗出者死飲食過多脾不運喘塞痰壅鬱火甚莫作胃寒熱藥投二陳茯苓陳皮甘草半夏即局方二陳湯芩連楂樸穩此因飲食過多脾胃不能運化致生氣急而喘塞也戴氏曰凡喘有聲便是痰痰壅氣盛便是喘大抵喘之為病胃中有鬱火膈上有稠痰劉河間曰得食墜下稠痰而喘稍止稍久食以入胃反助其火痰又升上喘反大發俗不知此而反以胃虛治之有用燥熱之藥是則以火濟火大不然也不若用二陳湯加芩連山楂厚朴等劑先運其痰次降其火兼理脾氣則喘必定醫林繩墨云此症名為食喘前賢詳悉已明凡診視之際須認明的確慎勿妄投藥餌以戕人命脈大無倫喉嗽鼾獨參湯服自能安有傷寒咳嗽喉中如鼾其脈豁大無倫乃空虛陰亡之象人參必須重用方克有濟病後氣虛兼氣短此乃氣不接續非喘也真危急之症兩許人參八味參六味丸加桂附即是氣從臍下尺洪盛氣從臍下衝上而喘兩尺洪盛或數或兼見盜汗潮熱咳嗽屬陰虛此屬陰虛當補峻大料左歸飲加人參或六味合生脈虛甚八味右歸可用無神之脈細微推細而兼緊尤為可畏元海無根肝腎虧感症亦有元海無根虧因肝腎子午不交以致氣短似喘者乃氣脫症也子午不交因氣喘重需熟地速可用一二兩及當歸亦要兩許甘草五錢堪緩劑以上三味即景岳貞元飲也濟之緩之堪云神劑如畏寒者可加煨姜證名氣脫甚傾危婦人血海常空及亡血之人常多此症如新產之後忽現喘咳氣急多因血去過多所致若用青陳樸杏蘇前之類利氣消痰多致不救臨診者宜細審之凡內外各證或有相似而治法有大不同者予悉採類是編以惠後學呃逆感證呃聲接續聯呃逆一症古無是名在內經本謂之噦因其呃呃連聲故今人以呃逆名之也觀內經治噦之法以草刺鼻嚏嚏而已或因火遏氣衝炎尤有可治隔久復聲終不治虛寒之極灸之不止命由天治呃逆不止用灸取穴法婦人以乳頭垂下到處是穴男子無可垂者以乳餅下一指為率與乳頭相直骨間陷中是穴男左女右灸一處艾炷如小麥大著火即止灸三壯不止者不治呃逆傷寒脈散亡王海藏云傷寒呃逆脈散死仲景之言不虛偽大抵原因失下致生陰消將盡火熱奔急上行而肺陰不納也是為陽極瀉心仲景瀉心止大黃黃連金匱瀉心加黃芩涼膈局方涼膈散歌曰硝黃竹葉草翹芩薄蜜和去硝黃脈微將盡者便或軟不宜下宜服瀉心湯以養陰退陽涼膈去硝黃亦可此法極穩便硬猶宜大承氣此陽明燥矢火結沖呃脈必有力者方可議下二藥神工作者良乃是東垣潔古之方壯實庸人守勿藥縱然去矢噦鬚髮有一種人或恃身壯或守不藥之說或乏醫治傷寒五六日後大去燥矢而呃逆者但其噦必緩其脈亦不甚數熱伏胃腸郁不宣下竅得通上透達譬如爐底壅塞火焰不光迨一透達而炎炎上行矣衝動肺陰而呃也投補寒涼俱不可火抑還防痞脹作治法不宜純用寒涼寒涼則遏抑其火且肺胃之氣漸向衰憊奚能禁此猛劑亦不宜大補大補則熱邪方盛勢必邪正糾纏變為痞塞脹滿之病脈虛生術參苓的寒熱相兼柴膏葉脈實宜之平治只消退噦煎歌曰歸芍芩連俱酒炒橘紅知母炒丹梔此董廢翁之方也陰汁充肌汗瘳吉此症有小心過甚初用上方一二劑或見身微汗或大便略行即改養陰滋潤之藥其人雖愈期年之間必憒憒如癡此乃熱邪伏於心胃不得透出故也水氣凌心犯絡包隨成呃逆命難逃召號五臟齊來救止呃湯功獨擅標此乃水濕侵脾發腫致喘變呃氣凌心包故有是症最為危急速投止呃湯救之薏苡一兩茯神一兩人參白朮蒼朮各三錢芡實五錢丁香五分廣皮半夏各一錢吳茱三分服二劑諸症潛安即石室秘錄之止呃湯也吐下之後復汗極胃中虛冷藥當熱氣鬱如知表未清吳茱理中憑斯訣大吐大下復極發汗胃中虛冷陽氣拂鬱於表醫與之水虛寒相搏因致嘔噦者久病胃虛四肢怠遇投克伐醫庸奈以致中虛呃逆成六君加減憑依賴此症脈必虛軟食亦減少呃逆舌攣語不明便堅咽燥及神昏的屬少陰宜速下大小承氣審投行少陰急下三條非燥不病然必痞滿燥實堅五者全見者方可下但非大實大滿不可輕投恐致結胸痞變甚有因攻脫元而斃者矣宜慎宜慎如遇呃逆俗謂呃忒面時赤似是陰火醫不識兩尺洪盛或細弦然必兼數按之無力飲如都氣丸安帖六味加五味子即是都氣丸病人叫熱身不熱此是無根火發越此呃逆者內已伏陰陰氣大甚腎水擅權肝氣不生丙火既病丁火又消所以遊行相火寒邪迫而萃集於胸中亦欲盡也故令人發熱大渴引飲欲去蓋覆病人獨覺他人以手按之身體肌肉骨髓血脈俱寒此種火即是無根之火也理中湯內配丁香或加刀豆柿蒂溫胃歸經火自息惟溫其胃其火自下正如爐中之火止可添炭不宜用水澆此症若用寒涼隨藥而逝矣氣從臍下直衝咽此症名陰非胃間病不在胃在少陰腎加味附子湯一劑真武湯加人參即是救得陽回呃逆痊真陽一回火降即止以上治呃之法誠先賢之秘笈學者慎毋忽諸嘔吐傷寒邪傳漸入里胃實不受氣壅閉逆胸作嘔治如何有聲曰嘔無聲曰吐有聲無物曰乾嘔成無己云嘔有責為熱者責為寒者有停飲者故仲景有治飲不治咳之論金匱言之最詳又有胃脘癰膿者仲景云不必治膿儘自愈按此症多服薏苡仁粥自可漸愈正治還應半表裡症屬半表半裡治法一二日內宜宣劑以去其壅上焦火森炙液干痰涎凝胃嘔如翻降火導痰加減用辛散重縋活變看生薑半夏茯苓厚朴連翹梔子花粉黃芩竹茹枇杷葉主之如渴加知母如心煩加姜炒黃連心下痞加枳實如口苦胸滿脈弦配柴胡邪氣漸深痰愈結芩連二陳苦寒折芩連俱酒炒再加厚朴黃柏花粉滑石蘆汁竹瀝薑汁如不止辛以散之芩連二陳湯加乾薑錢許生薑三錢再不止重以縋之用金銀器煎煎上藥或加入金銀箔五七葉甚者更加寒水石赤石脂如挾虛旋覆代赭湯須識仲景云傷寒發汗若吐若下解後心下痞硬噫氣不除者旋覆代赭石湯主之喻嘉言云故用代赭石領人參下行以鎮安其逆氣微加散飲滌邪而痞自開矣又云此亦伏飲為逆但因胃氣虧損故用法以養正而兼散餘邪大意用在噫氣不除上既心下痞硬更加噫氣不除則胃氣上逆全不下行有升無降所謂弦絕者其聲嘶土敗者其聲噦也旋覆花代赭石人參半夏甘草生薑大棗即仲景旋覆代赭湯旋覆花一名金沸草要用綿裹煎如不虛只用旋覆沖赭石如用旋覆花須用蠶綿瀝過可服否則其毛惹肺致咳不休調沖赭石止可一二錢凡嘔不止以此二方定虛實用之周揚俊曰以上二條應入痞結類因噫氣多故附於此學者自宜意會嘔吐脅疼便血張此屬風邪肝受傷葉天士云凡或便血風淫所致麥冬三七芎歸共救血平肝清大腸麥冬一兩三七一錢川芎五錢當歸一兩此陳士鐸之救血平肝湯又如腹滿齊噦嘔小水不利命遭殃喻嘉言曰不尿腹滿胃內壅不下行矣若更加噦則胃氣將竭愈上逆矣再有何法可以驅其邪而使之能活也初起嘔清宜養胃或兼吐飲食此著寒傷胃也宜人參養胃湯主之歌曰人參養胃湯參苓草朴蒼草果烏梅藿橘紅半夏姜微煩潮熱大柴詳如潮熱內實不大便嘔不止心下急鬱郁微煩者宜下之仲景云嘔家不可下然金匱方有大黃甘草湯治食已即吐蓋欲嘔者其症在上因而越之可也而逆之使下則必抑塞潰亂而益甚故禁之若既吐矣吐而不已有升無降則當逆而折之無速與大黃也然亦須慎渴後嘔宜大半夏先渴後嘔宜半夏陳皮赤茯苓生薑即金匱大半夏湯嘔渴豬苓是妙方先嘔後渴豬苓澤瀉茯苓滑石將四味先煎去滓加甘膠再煎服之即仲景豬苓湯水停心下渴協嘔小青龍治脈浮長小青龍專能治水水去而渴自止嘔亦住矣歌曰桂麻芍草夏乾薑五味辛肚腹時疼屬太陰藥用理中合二陳再加生薑藿香此症如初起腹滿而吐食不下自利益甚時腹自痛者手足寒脈沉微少陰四逆二陳宜生薑主之此症常見飲食入口即吐心下嗢嗢欲吐復不能吐乾嘔吐涎涎少嘔多頭痛甚厥陰湯用吳茱萸吳茱人參生薑大棗即仲景吳茱萸湯配二陳主之此皆直中三陰非陽經傳來者故悉用熱藥凡三陰嘔吐藥宜冷服即內經從治之法曾有寒吐用四逆湯理中湯薑附到口即吐後去乾薑白朮只參附加丁香木香煎成加沉香立止蓋虛寒痰氣凝結丁附既溫佐以沉香木香則通乾薑白朮則泥耳藥餌茶湯毫不受強飲些須嘔反驟鬱怒之人肝氣衝膈多有此症脈必帶弦膈氣不通醫少知內關一灸食如舊內關穴在掌後大骨盡處男左女右艾炷如豌豆大灸七壯甚者倍之灸後即能食陽症新瘥嘔熱余別無所因此餘熱在胃脘中也竹葉石膏果最奇人參白虎湯加生薑半夏竹葉即仲景竹葉石膏湯按此方治嘔豁痰故去熱而不損其真導痰逆而能益其氣楊潛村云虛者左歸加花粉去茯苓歌曰左歸飲用萸山杞地草雲苓景岳方病久中虛六君子虛而挾熱加黃芩挾食加厚朴挾寒加藿香砂仁或補中配炮薑半夏亦妙口乾燥嘔胃陰虛必有面色嬌紅脈虛細數等症都氣飲加歸地妙左歸飲去茯苓加生地當歸尤效脈虛身熱症難醫仲景謂嘔而脈弱小便複利身有微熱而見厥者難治以其虛寒之甚也胃氣如虛熱未退葛根加參理最宜再配玉竹知母竹茹白朮黃芩半夏蘆根茯苓甘草生薑大棗之類臨診酌之鬱冒鬱冒神昏幹不飲二便如常貌醉形傷寒五六日漸變神昏不語或睡中獨語目赤唇焦口乾不飲水稀粥與之則咽不與則不思但心下無痞腹中不滿大小便如常或傳至數日形貌如醉陶節庵所謂越經症即此候也六脈細數口不語此熱為傳手少陰脈不洪大慎勿可下宜梔子黃連黃芩湯脈若浮病在丙即小腸火還須導赤散頻進生地木通甘草稍淡竹葉即局方導赤散陶氏或加芩連脈若沉病在丁即心火瀉心湯服得安寧小腸為丙火心為丁火婁全善綱目云心氣熱則上竄宜導赤心熱泄小腸如釜底抽薪之義以黃連瀉心猶揚湯止沸之義也浮沉有力熱丙丁導赤瀉心各半勻歌曰芩梔知麥連犀草滑石燈心參茯神即陶節庵導赤各半湯或用犀角地黃湯方見畜血條熱解陽明經要詳此解陽明經血中之熱也素充壯如失下熱極身冷脈微弱涼膈散方見呃逆條熱可宣有患熱病肢體不甚熱問揚擲手足如躁擾狀昏憒不知人事時發一二語不甚了了非譫語也脈微細如欲絕其人平日素充壯者此失下熱極以致身冷脈微而昏冒將死然畜熱內甚脈須疾數以其熱極畜甚而脈道反不利若急下之則殘陰暴絕而死蓋陽氣復竭而然也不下亦死宜涼膈散或黃連解毒湯養陰退陽積熱漸以宣散則心胸再暖兩脈漸以生矣王損庵法大柴胡下之止用蒸大黃二錢繼以解毒湯數服而平虛用當歸補血煎蜜炙黃耆一面酒洗當歸三錢即東垣當歸補血湯凡傷寒似神清而時發一二語昏憒者多為虛須主以人參或當歸補血湯後看兼症配相宜藥諸虛乘寒則為厥此內經語鬱冒附子湯須設此仲景意真武加人參即附子湯欲活血脈九竅通芎姜再配天麻入天麻性平活血脈通九竅脈微應虛三白湯四君去人參加白芍即三白湯芎麻添附為多力此症仍可用人參傷寒體虛如有痰或四五日後神昏不語者即壽世保元所謂昏迷傷寒是也參朮耆陳和竹瀝再加當歸薑汁有服至十餘日方吐一字月餘舌乃能轉熱淨而後能言此症竟有陰寒相逼所致宜八味丸主之神思似清時憒昏或爾語次忽鼾聲此症甚危須急治歸脾湯並養榮斟凡遇此等症候參耆用兩許甚者加附子歌曰歸脾志棗陳耆朮參草苓圓廣木香歌曰養榮草芍陳歸志地味參耆桂術苓煩躁水虧火旺金必傷火入於肺則成煩火入於腎則成躁脈參虛實用溫涼王海藏云煩出於肺躁出於腎此火歸肺腎也臨診細審慎勿忽略寒熱誤投斃命立見肺腎聯煩躁兼成無己曰煩躁者先煩漸至躁也躁煩者先躁而迤邐復煩也從煩至躁為熱先躁後煩謂怫怫然更作躁悶此為陰盛格陽雖大躁欲於泥水中臥但飲不得入口是也此氣欲脫而爭譬如燈將滅而復明是矣按內熱曰煩謂心中郁煩為有根之火但煩不躁及先煩而後躁者皆可治外熱曰躁謂身體手足動擾欲裸衣入井為無根之火但躁不煩及先躁後煩者皆不治獨煩不躁熱因先有表症不得汗內外皆熱躁亂不寧取汗則定有裡實熱鬱大便不通心神不寧脈數實有力下之則定有火客心胞上焦不清以黃連梔子等涼解投之妙惟躁無煩寒是的或顴帶遊紅症似戴陽其脈按之不鼓躁亂欲狂欲坐臥泥水中口中和乃虛陽上攻也即陰盛格陽陰極發躁冷服附子理中湯躁擾即定起不安兮睡不貼謂之煩此一症與上之似戴陽症大不相同藥須竹葉石膏湯如不禁石膏可用濟生方去石膏加茯苓小麥即人參竹葉湯心熱清心蓮子益心中蘊熱而煩歌曰清心蓮子飲參耆赤茯苓地骨車前共麥冬甘草芩血液耗散猛獨參血液耗散心神不安者猛進獨參湯匱乏當歸補血增如因力艱不能服參濃煎當歸補血湯代之下後心煩如腹滿坐眠不安梔樸純煩謂虛煩腹雖滿按之亦不堅宜梔子厚朴枳實此三味即仲景梔子厚朴湯下吐汗後劇不眠或吐或下或汗之後適變此症皆因誤治所致非謂三症齊見始變心中懊憹反倒顛似煩非煩之象梔子香豉為上策此二味即仲景梔子豉湯若氣少者加甘草若嘔者加生薑舊便如溏法另遷大便如溏者此方禁服宜改用滲濕之劑凡下後復發汗夜靜無眠煩在旦此症煩在晝夜不煩嘔渴全消表症無脈沉更兼微身冷姜附辨仲景誤治條下論云下之後復發汗晝日煩躁不得眠夜而安靜不嘔不渴無表症脈沉微身無大熱者乾薑附子湯主之沈堯封云經有虛則相併之說晝日煩躁者我身之微陽感天之陽欲外出而與之並也夜乃天之陰我身微陽不敢外出故反安靜耳煩而兼嘔是少陽證煩而兼渴是白虎證故辨之無表證即在脈沉微無大熱上見脈虛微悸不眠脈或虛大或微細亦有止煩不悸生脈散配柏子煎柏子仁要去油再加茯神當歸如有火加涼藥一二味元參山梔竹如花粉之類有飲痰水凝滯溫膽二陳加竹茹枳實即是集驗溫膽湯無無痰飲也遠志歌曰遠志參耆歸棗斛茯神冬草及生薑即名遠志飲子若煩甚加竹茹知母下劑俱宜酌要先悸忡太陽中風已汗攻仍熱頭眩心悸忡腎陽虛致瞤動振振欲擗地擗者闢也避也汗出過多衛氣解散其人似乎全無外廓如魚失水則躍故振振然四顧彷徨無可置身思欲闢地而避處其內也芍術苓姜附子同即真武湯發汗過多心下悸叉手自冒耳無聾此膻中陽虛陽氣虛胸常欲按上焦心肺主桂枝甘草理當從桂枝和營衛重加甘草不令走泄陰氣汗過心虛氣不生腎間發動作奔豚上蒸凌心臍下悸大棗惟和桂草苓茯苓肉桂炙草即張子和桂苓丸子奔豚用棗守中使下焦之邪不得上攻按此症藥宜用甘瀾水煎作甘瀾水法以水置盆揚之數百遍水上有珠子數千粒即成悸若脈逢代結來脈動而中止自還者曰結不能自還曰代血氣虛衰不能相續也心中動悸真氣內虛也按傷寒脈結代與雜病不同投以炙甘草湯補氣血而復脈湯宜炙草主堪裁一名復脈湯喻嘉言曰此仲景傷寒門中之聖方也桂枝薑棗麻仁地即生地參脈阿膠清酒偕古吳葉天士常治邪少虛多之症擬以育陰息陽之法用此方加減投之多應喻氏稱為聖方果信其言四肢厥逆心下悸症見厥逆但少故主治在心悸治水宜先苓草技不爾水漬入胃中必定頻頻變作利茯苓桂枝甘草生薑即仲景茯苓甘草湯太陽症飲水過多水停心下必悸火畏水故心惕惕然動不自安也以水停心下無所不入若漬腸胃必作自利故經云先治其水後治其厥厥為邪之深者猶先治水況病之淺者乎吐下逆滿氣衝胸脈因沉緊眩頭攻此仲景論誤下茯苓甘草湯證之變局不但客氣動膈而脈亦沉緊則水氣已陷入中州矣動搖振振乃汗誤表裡受傷甘草雲苓術桂崇即金匱苓桂朮甘湯此症乃挾痰飲阻其胸中之陽水精不能上布故目眩當從小便去之以除中州之水濕也此方主之振慄氣血俱虛振戰慄振者責其虛寒虛則不至於爭故振聳耳戰者為正與邪爭爭則鼓慄而戰矣戰雖重於振而慄重於戰也戰者正氣勝慄者邪氣勝也皆邪正之相爭也大抵氣血俱虛不能榮養筋骨為之振振而不能主持也調榮養衛方無別歌曰養榮草芍歸陳志地味參耆桂術苓薑棗引虛寒甚者加附子更效即人參養榮湯若遇身搖不得眠十味溫膽憑斯啜此心虛膽怯氣鬱生涎涎與氣搏變生驚惕不眠等症歌曰枳實夏苓陳味草棗仁熟地誌人參即三因十味溫膽湯姜棗引惕瞤如傷寒未經汗筋惕肉瞤潮熱犯手按臍旁硬甚疼只消加減大柴散二便皆澀歌曰柴芩蔞粉玄明實地麥丹皮草首烏薑棗引即加減大柴胡散屢經發表汗太過惕瞤人參養榮附是症皆因攻表發汗太過邪熱未解血氣虛奪筋肉失養所致或不因此由稟素血少邪熱傳於血脈之中火性動惕故也汗後虛煩瞤不眠加味溫膽湯須輔歌曰芎歸芍地芩連草柴夏茹姜橘棗參即加味溫膽湯撮空循衣摸床謂撮空總云宜補不宜攻多是大虛之候乃精神耗散不能主持也不問傷寒雜症以大劑補之多有得生者脈辨弦生澀者死傷寒論曰循衣摸床惕而不安微喘直視脈弦者生澀者死此乃以脈之弦澀辨胃氣之存亡然脈弦則迢迢而長知胃氣尚在也故可以大承氣下之而愈然亦危極矣必脈實症實者方可行之下後即當隨症大補存亡胃氣要宣通務要慎思明辨斑疹咳嘔心煩身痛束耳聾足冷或有肚腹痛者發斑推斑者有觸目之色而無礙手之質即稠如錦紋稀如蚊跡之象也總之以鮮紅起發者為吉色紫成片者為重色黑者為凶色青者謂之藍斑不治痧者疹之通稱有頭粒如粟象癮者即疹之屬腫而易癢須知出要周勻沒要徐緩不外乎手太陰足陽明之患故繆仲淳專以肺胃論治為精也予著有時疹療元一論列於補遺條內學者並宜參究升麻葛根治法主乃解陽明風熱之毒如斑疹已露勿服恐重虛其表也初發斑疹時或大便熱泄一二次不可止之惟熱解自能止也若脈弱食少大便溏者可加生白朮歌曰升麻葛根白芍草此是仲陽錢氏方弱熱參芩並可隨虛弱之脈如或有熱可加人參黃芩若血熱者犀角地黃俱可入酒炒芩連桔梗連翹元參薄荷花粉蘆根之類舌胎黃燥須白虎石膏知母甘草粳米脈伏心煩斑欲露謂之欲斑煩止神靜肌膚中無隱隱之狀始為斑盡也已出脈洪反口乾竹葉石膏丹地助脈如洪而無力兼體虛煩渴加人參麥冬知母令汗出自愈若嘔自宜大半夏陳皮半夏茯苓生薑但要更衣承氣量凡解大便謂之更衣若脈見洪數有力心下硬痛者方可赤斑煩痛心胸熱大青功擅善扶匡大青味苦大寒之物配解毒湯加栝蔞根主之能退赤斑斑起心窩毒勢深此處更多起斑湯內用元參升麻荊芥黃連共花粉當歸草茯神陳士鐸云斑起心窩色必深紫大為危候非用大法終成死症速投元參三兩升麻荊芥黃連各三錢花粉五錢當歸一兩甘草一錢茯神三錢名起斑救死湯一劑瘥二劑愈矣倦怠懶言惟自汗補中益氣湯毋慢此症因內傷氣不足虛火遊行於外亦身痛心煩作熱發斑第脈虛大為驗若作有餘治立危速進此湯熟睡熱退而愈歌曰補中益氣陳耆朮參草升柴歸棗姜即李東垣之補中益氣湯也內傷斑疹胃元虛遍身遊火外行綻其斑色亦淡紅而嬌嫩或有不紅而色白補降溫和大建中此屬陰斑須細盼胃氣虛極一身之火遊行於外宜補以降之吳鶴皋云此是汗吐下後之症中氣虛乏則餘邪無所歸附隱隱然見於肌表其色淡紅而不甚顯為辨也參耆所以和中夏草所以調中此皆健脾藥也復有歸芍之活血則外溢之斑流而不滯有桂附之溫中則失位之火引而歸原以中營之幟一端而失位之師各就其列也是症也以桂附參耆而治斑疹法之變者也醫而未通於權則不足以語此歌曰參耆桂附草白芍夏當歸即大建中湯內藏伏陰脈必虛炮姜理中先可啖內有伏陰或誤服涼藥逼其虛陽浮散於外而為陰斑脈雖洪大按之無力或手足逆冷過於肘膝者先用炮姜理中湯以復其陽次隨症治發黃熱多黃似橘皮明如蜜橘之皮黃而亮脈數宜涼身不疼一身不痛解熱為主小便不利腹微滿茵陳蒿湯直入兵茵陳梔子大黃即仲景茵陳蒿湯薰黃色黯脈沉緩滲濕為先身痛憑一身盡痛滲濕為主初起有力脈不微便堅能食利為宜茵陳蒿湯主之茵陳五苓濕熱解以茵陳煎湯調五苓散服之稍久形虛固胃脾異功散加當歸白芍大棗六君子湯去半夏即五味異功散發汗不徹熱停黃期年不愈色蒼蒼其症身面皆黃多熱但飲食亦不減茵陳梔子各三分二錢五分為一分獨配秦艽是妙方再加升麻各四錢共為末每次三錢水煎服以知為度蓋秦艽退黃極妙以其性能退陽明經濕熱邪氣也無濕熱者恐傷燥宜慎之外臺秘要統治三十六黃方用雞子一枚連殼燒炭研細以醋一合和之溫服鼻中蟲出即愈重者不過三服然方亦奇雖未試姑錄存考水濕傷脾寒現外脈沉身冷是陰黃四苓散配茵姜附五苓散去肉桂即四苓散是症再配茵陳乾薑附子也冷傷寒中理中湯佐以茵陳脈必虛弱太陽太陰遇司天下之太過陰黃變王海藏云傷寒症遇太陽太陰司天若下之太過往往變為陰黃一則寒水太過水來侮土一則土氣不足水來侵之治法如左茵陳主對病加增醫佔先以下諸症茵陳為主所加不拘小水不利煩躁渴二苓茯苓豬苓滑石桂歸煎韓祗和名茵陳茯苓湯喘嘔不渴惟煩躁苓夏生薑陳術添韓氏名茵陳陳皮湯四肢偏冷腰如汗炙草乾姜附子痊韓氏名茵陳四逆湯冷汗旋旋時不止制附乾薑必要兼韓氏名茵陳姜附湯姜附不已脈尚遲木通歸芍吳茱施韓氏名茵陳吳茱湯宗顏刊定千年秘趙秀才字宗顏以上治法出自彼定依法次第效誠如次第用藥者先投茵陳茯苓湯次茵陳陳皮湯又次茵陳附子也有下早病黃寸微尺弱身冷次第用至茵陳四逆大效面目皆黃及遍身驟然所發遲治必死初不醫之久必傾傾者頹敗之謂苓苡茯苓薏苡車前各三兩桂桂心三錢茵茵陳三錢相佐達權衡連連四劑潛消退減半依方法論深白朮一兩土炒加添仍繼服減半加朮再服四劑濕熱宣除體漸亨此法系石室秘錄大治救命之方也疸症多緣起內傷汗瀉猶防精氣亡陳陳皮五分術白朮一兩茵茵陳二錢苓茯苓一兩梔梔子二錢薏即米仁一兩等守服旬天病即康此是內傷挾感成黃連服十劑去梔子再服五劑乃陳遠公之法用之頗效產婦身黃濕熱壅醫家遇此法難窮白朮一兩車前五錢荊芥一錢佐茵陳五分薏苡二兩茯苓五錢同症雖濕熱起本於虛陳遠公云補虛治黃未為不可醫人不究其因束手聽其死亡予遵用之多效小便自利急膀胱腎氣不納小水急下御女多勞額黑量名女勞疸如寸口無脈形如薰黑鼻出油汗而冷者皆不治酒疸雙眸綠影形心痛時常酸水噴葛花枳椇茵陳主枳椇子一名雞距子一名萬字果又名金鉤梨經霜赤而味甘其葉入酒酒化為水門外植此樹者屋內釀酒多不佳肝鬱相逢合左金黃連六兩薑汁炒吳茱萸一兩水泡三次焙乾共研細末以粥糊為丸即東垣左金丸又名茱連丸按肝居於左肺居於右方名左金者謂使金令得行於左而平肝也邪熱在胃不相傳邪入在胃仲景所謂邪並陽明萬物歸土之義無復他傳也挾食薰蒸黃髮纏症名谷疸宜清熱莫使留連起變端此症乃挾外濕與胃中食飲之濕交併鬱蒸不達以致發黃即丹溪所謂如造麴然何惠川文堂集驗方有云傷寒五六日周身發黃以麻油半盞水半盞入雞子清一枚服之即退按此方用麻油以潤腸使大便易於下行雞蛋清功專利濕其效尤捷如用茵陳蒿湯恐其太峻不若用此二味更為穩當故採錄之瘀血發黃微沉結脈必如此腹滿如狂小便澈仲景主以桃核承氣湯等證宜參畜血條此症已詳畜血條下言之已悉瘀熱脈浮滑數別瘀熱之脈浮滑緊數治宜解熱為主咳嗽傷寒咳嗽以為輕俗云重傷風也柯韻伯曰傷風之重者亦屬傷寒仍分六經治之蓋風寒暑濕先自皮毛而入皮毛者肺之合也雖外邪欲入臟腑必先從其合而嗽也故醫之善者凡病必先治其合也喉中習習癢淫淫肺主氣形寒飲冷則傷之使氣逆而不散衝擊咽膈令喉中淫淫如癢習習如梗而咳也或醫人云咳則有聲無痰嗽則有聲有痰初起脈浮頭痛急脈或帶緊拘急惡寒發熱無汗余月芎蘇歌曰芎蘇前葛和薑棗杏桔桑皮枳夏陳即元成之芎蘇飲也按準繩方無杏桑前胡加柴胡茯苓甘草或加羌活亦可冬十神歌曰麻陳昇芷芎蘇葛香附草姜赤芍蔥即古傳十神湯也二方輕重得宜凡非時之氣可隨症加減用胃熱薰蒸合白虎虛者加人參若脈浮自汗頭眩眼脹鼻塞清涕者傷風候也亦以芎蘇十神二方分治脈弦口苦少陽循必兼寒熱小柴胡去人參薑棗加乾薑五味煩滿蔞仁痞枳實以上湯主之加減嘔利無眠渴豬苓如下利嘔渴心煩不得眠而咳嗽者豬苓湯治之即五苓散去白朮肉桂加滑石阿膠是也吳鶴皋云五苓瀉濕勝故用桂朮豬苓瀉熱勝故用滑石第恐諸藥過燥故又加阿膠以存津液小青龍治表寒合仲景所謂表不解心下有水氣乾嘔發熱而渴者是也歌曰小青龍內麻黃桂草味乾薑芍夏辛停飲裹寒真武呷內經五飲雖異而仲景治法惟專主溫通學者宜考去芍加姜辛味子真武去白芍加生薑細辛五味仲景謂四肢沉重疼痛小便如常大便自利而咳者脈細沉遲陰咳確四逆湯加五味常見是症有手足逆冷上過乎肘下過乎膝四肢厥逆腹泄疼冷不過肘下重而咳仲景所謂此亦少陰陽邪入里枳實柴姜味草芍枳實甘草柴胡芍藥即仲景之四逆散也因有咳者故加姜味汗不透餘熱嗽養血清涼六味彀餘熱在胃咳嗽不止者先以涼血養血投之不效者繼以六味飲必應蓋熱氣逼傷胃陰故也若以參耆病愈余適逢乾咳莫為虛此乃餘邪為胃氣鼓動欲出也若認作真虛症再投歸脾生脈等劑則重斂其火漸傷陰分而成弱者有之矣俗諺云傷風不醒變成勞即此之謂也只宜開導宜清潤宜養血涼血順其勢而導之不可泥為補劑得力之後寒涼傷中畏而勿用也自古明醫法不拘先哲治療臨證處方在在因宜陽明宜汗汗無來此乃太陽轉屬之症表邪未罷漸次痰多咳嗽乖此時取汗益不可得只投清潤之劑骨皮花粉雙冬母天冬麥冬知母貝母寒熱未止者小柴胡為主加入上藥久久痰清熱退哉久久則痰清咳止經絡熱邪即從此解雖終不得汗亦有漸愈之理挾痰挾痰身熱如中滿鼻塞頭疼及噁心或痰飲積凝脈見弦濡而滑症帶頭暈若見陽明如口渴潮熱有汗調白虎石膏知母甘草粳米否則參蘇飲必寧歇曰參蘇飲內芎苓葛草夏陳前枳木香其人參木香須斟酌進退用之嘗遇此症見有頭暈噁心者予用二陳湯加浮海石白芥子制南星亦多應手下頦振振動搖看病人不覺有涎痰心虛神憊兼食少藥宜固本六君銜俗云痰症傷寒即此候也宜六君子湯主之是症加酸棗仁大補心氣挾暑脈虛身熱為傷暑惡熱頭疼自汗增胸滿心煩渴氣促便溏尿赤倦精神暑濕蒸人脾土受傷故肢倦便溏暑熱傷肺故氣促心煩口渴便赤濁氣在上則生䐜脹故胸滿惡食暑先入心汗為心液故自汗濕盛故身重身痛暑傷氣元氣耗傷故脈虛而不足東垣益氣兼清暑耆術參歸草葛升蒼朮青陳曲柏瀉麥冬大棗味姜停人參黃耆白朮蒼朮神麯陳皮甘草麥冬五味當歸黃柏澤瀉青皮升麻葛根大棗生薑即東垣之清暑益氣湯也暍熱躁煩汗惡寒仲景云太陽中熱者暍是也其人汗出惡寒身熱而渴也此是熱病證據素問在天為熱在地為火熱者火之氣也故熱乃五氣之一而熱病即傷寒有五之一感烈日之氣而病面紅紫脹眼珠黃白珠變黃色脈微洪微者輕浮之象洪者挾熱之徵按程郊倩後條辨云暍病脈不浮不思仲景論暍即難經之熱病也難經云熱病之脈陰陽俱浮浮之而滑沉之散澀此等緊要處豈可模糊讀過衛陽虛渴背微冷仲景云傷寒無大熱口燥渴心煩背微惡寒者白虎加人參湯主之沈堯封云背為陽背微惡寒者陽虛症也但陽有不同真水真火是腎中之陰陽也氣血是營衛中之陰陽也此條口燥渴心煩暍熱內熾仍是白虎症惟暍熱傷其衛氣致背微惡寒與腎陽全無關涉故止用人參補衛氣不用附子補腎陽至若少陰病口中和其背惡寒者則衛陽腎陽並傷則人參與附子並用問同一背寒何以分別傷衛傷腎曰條內本自明白傷腎陽者口中和傷衛陽者曰燥渴白虎加參服遽安濕溫肢重頭疼或妄言此濕熱並至之病脛寒腹滿汗黏黏病在太陰不可汗古人濕家忌汗白虎人參蒼朮痊有一種頭痛妄言兩脛逆冷胸腹滿多汗其人常傷於濕因而中暑名曰濕溫其脈陽濡而弱陰小而急治在太陰不可發汗宜白虎湯加蒼朮主之保命集云立夏之後至立秋處暑之間傷寒者身多微涼自汗四肢沉重謂之濕溫蒼朮白虎湯主之或先用人參白虎湯數劑溫病濕侵體似縛仲景云太陽病關節疼痛而煩脈沉而細者此名濕痹之候其人小便不利大便反快但當利其小便濕痹者即難經之濕溫症也素問在天為濕在地為土濕乃上之氣也故濕為五氣之一濕溫乃傷寒有五之一溫者亦火之氣也夫火特五氣之一乃分而為二者以陰陽之各異耳暍熱之火陽火也得之烈日故三時不病惟夏日太亢乃病溫病之火陰火也得之鬱熱四時皆有不獨夏也素問分先夏至日為病溫後夏至日為病暑腳伸仰臥腿難縮或時筋抽似搐此乃濕熱流絡所致欲翻身轉痛難禁利濕除溫梔柏握梔子柏皮甘草即仲景梔子柏皮湯或挾外寒內濕壅麻黃赤豆連翹逐麻黃連翹赤小豆生梓白皮杏仁甘草大棗生薑即仲景麻黃連翹赤小豆湯沈堯封云程扶生以麻連小豆湯為濕熱主方不思麻連小豆湯發汗之方也梔柏湯利小便之方也若以麻連湯為主方不惟梔柏湯無著落即條內但當利小便句亦無著落梔柏湯只有濕熱而無風寒者宜之若外兼風寒又屬麻黃連翹赤小豆湯素問在天為燥在地為金燥亦五氣之一夫燥未有不從火熯而成故凡病或挾火者已經類列各條其現證有口燥渴或大便燥結等燥字此燥症已寓其中矣故燥症無專類之條學者自可意會莫謂編者遺漏而復疑燥不病人耶風溫冬不藏精春病溫腎關氣泄外寒侵陰邪入臟深難愈表散須參溫法行經云冬不藏精春必病溫蓋冬月以精動則關開氣泄寒風深入骨髓而腎主閉藏無門可出至春月地氣上升肝木用事肝主疏泄木主風外風相召於是吸引腎邪勃勃內動而病發矣必全具少陰之症喻嘉言闡發奧義而以溫法並汗法一藥同用體長沙不宣之秘用麻黃細辛附子救之即仲景傷寒中麻黃附子細辛湯也寒傷冬月藏肌膚證與三陽合例符經云冬不藏精春必病溫故所重者不藏精也每見多欲不藏精之輩病溫者更危表裡陰陽齊交熾六日不俟命南柯正已先傷外邪復入邪正相熾名主客交腎陽不鼓難升液熱煩外現燥兼枯此症嘗有認作陽明而竟誤投斃命者多可不慎乎悟徹仲景真妙諦汗下兼溫反掌瘥喻嘉言以附子助陽擬投附子黃芩黃連大黃以溫法兼下法一藥同用即仲景附子瀉心湯也厥陰初氣主風木凡逐年主之六氣初厥陰二少陰三少陽四太陰五陽明六太陽此為地盤其位不易客氣加臨感冒觸凡逐年客之六氣初厥陰二少陰三太陰四少陽五陽明六太陽此為天盤其位旋轉不定以左手掌輪之於值年司天之位上從右退二起推順數假如子年少陰君火司天從子位退二在戌位上初氣即太陽寒水二氣在亥位上即厥陰風木余仿此例凡逐年客之三氣即是當年司天其司天在泉之法注於疫癘條下易記歌主氣云厥少少少陽太客氣云厥少太少陽太病似傷寒形樣同治法大旨兼參主客之氣及用藥之宜忌經云必先歲氣毋伐天和此之謂也春溫醫說俗稱疫俗謂時氣傷寒以訛傳訛之談仲景以冬月所受風邪以寒統之定名傷寒治法分別寒傷營風傷衛至春時令和煦其氣亦溫所感之邪以溫統之謂無風不入太陽故所感之邪溫字上加一風字以別太陽風傷衛之不同若作冬月傷寒治法誤人不淺喻嘉言云病溫之人有發表三五次而外症不除者有攻裡三五次而內症不除者傷寒之邪表傳裡傳盡六經病亦已仲景傷寒論中有傳解法盧子繇金鈚中有傳經論學者宜參讀之此是溫邪內達外留伏募原畏補劑治須疏滯達原參歌曰達原飲內檳榔樸草果芩知白芍甘此吳又可之達原飲也審明虛實陰陽異柴胡清燥歌曰柴胡清燥燈心地歸芍芩知草粉陳即柴胡清燥湯參白虎白虎湯配人參毒防瘀胃大承氣大黃芒硝厚朴枳實即仲景大承氣湯吳又可傷寒三注云此邪從口鼻而入舍於伏脊之內去表不遠附胃亦近乃表裡之分界即內經虐論所謂橫連募原者也非若傳經之症如脈雖數未至洪大其邪尚在募原宜投達原飲以透其邪如蒸蒸汗出氣微液涸宜投人參白虎湯如應下失下陽伏時厥既下厥回脈大而數此里邪去而鬱陽暴伸舌已生津宜柴胡清燥湯去花粉知母加葛根隨其性而升泄之其有毒邪復合瘀留胃中急投三承氣酌量以下之設緩拘滯必無救矣每見二三日即死者此類是也臨診者潛心細察慎毋大意痙症太陽發熱脈沉細項強足寒面赤際口噤反張背角弓汗因誤過虛亡液此即風傷衛之變局也經云肉之大會為谷肉之小會為溪溪谷之間以行營衛沈堯封云夫衛行脈外即在肌肉腠理間風邪中衛由太陽而入壅肌腠之間脈道擠小所以沉而細也脈道時通時塞所以卒口噤背反張也肌肉不能舒轉所以項背強𠘧𠘧也陰陽不能升降所以頭熱足寒面赤目赤也汗無發熱惡風邪邪字當作斜字讀項背𠘧𠘧音殊𠘧𠘧鳥縮頸貌剛痙耶仲景葛根湯主治汗多柔痙桂枝加前輩云葛根象肌肉取其入肌肉以祛風耳即無汗之剛痙亦風多寒少病甚於脈外故不用麻黃湯中加葛根仍用桂枝湯加麻葛存芍藥已保不病之營凡痙則上項脈症俱在內如無上項脈症不得名痙痙有剛柔二種全在有汗無汗上辨葛根麻黃桂枝白芍甘草生薑大棗即仲景葛根湯瘡家發汗禍旋踵痙變依然身體痛勢必鬼門開病除經云開鬼門即發散之意葛根湯效任施用仲景云瘡家雖身疼痛不可發汗發汗則痙沈又彭云此症即不可發汗又有不得不汗之勢一友用葛根湯取效以葛根湯即痙症發汗方也景岳全書云痙症甚多而人多不識在不明其故而鮮有察之者耳蓋卒然暴病而見反張戴眼口噤拘急之類皆痙病也觀仲景以汗下為言謂其誤治亡陰所以然也余因類推則常見有不因誤治而凡屬陰虛血少之輩不能養營筋脈以致搐攣傴僕者皆是此症如中風之有此者必以年力衰殘陰之敗也產婦之有此者必以去血過多衝任竭也瘡家之有此者必以血從膿出營氣涸也小兒之有此者或以風熱傷陰遂為急驚或以汗瀉亡陰遂為慢驚凡此之類總屬陰虛之證蓋精血不虧則雖有邪干亦斷無筋脈拘急之病病至堅張其枯可知欲治此者必當先以氣血主之而邪甚者或兼治邪若邪微者通不必治邪蓋此症之所急者在元氣元氣復而血脈行則微邪自不能留何足慮哉奈何今人但見此症必各分門類而悉從風治不知外感之風寒邪症也治宜解散內生之風血燥症也止宜滋補矧此數者總由內虛本無外邪既以傷精敗血枯燥而成而再治風痰難乎免矣故余詳言於此以明痙症之要疫癘每逢歲歉受飢餒因腹常枵中氣虧荒歲多疫皆因飢飽失時所致右氣口脈多大用人參敗毒散先發其表次用人參柴胡湯以和解右脈大於左自汗心下不脹無表裡症見者補中益氣湯若用正傷寒法大汗大下多致不救歌曰二活柴前芎桔枳薄荷參草配苓姜即活人書中之人參敗毒散也腐穢氣蒸難避染凡饑饉之歲疫病盛行大率春夏為甚蓋溫暑熱濕之氣交結互蒸人在其中無隙可避病者當之魄汗淋漓一人病氣足充一室況於連床共榻沿門闔境共釀之氣益以出戶屍蟲載道種種惡穢上溷蒼天清淨之氣下敗水土物產之氣人受之者溫暑熱濕病從其類有必然之勢也天時氣運合相推治法當分天時寒暄燥濕病者虛實勞逸因時制宜不可拘執久旱天時多燥熱疫流行忌用燥劑宜解毒潤燥天久霪雨濕令大行脾土受傷民多寒疫多兼瀉痢忌用潤劑宜滲濕理脾子午年少陰君火司天陽明燥金在泉卯酉年陽明燥金司天少陰君火在泉寅申年少陽相火司天厥陰風木在泉己亥年厥陰風木司天少陽相火在泉辰戌年太陽寒水司天太陰濕土在泉丑未年太陰濕土司天太陽寒水在泉其五運六氣天符歲會九宮八風超神接氣等論須參張介賓類經言之最詳張子和儒門事親云病如不是當年氣看得何年運氣同只向值年求活法方知卻在至真中其義甚深業醫者不可不知上中清邪從鼻息人之鼻氣通於天故陽中霧露之邪者為清邪從鼻息而上入於陽入則發熱頭疼腮腫喉痹失音經云上焦加霧升而逐之兼以解毒頭疼頤腫喉音失大頭普濟法東垣如世俗所稱大頭瘟者頭面腮頤腫如瓜𪃿者是也宜普濟消毒飲主之歌曰普濟消毒飲人參芩連柴桔橘藍根元參翹簿殭蠶勃牛蒡升麻甘草勻此李東垣之方也咳喚蛤蟆另一策俗稱哈蟆瘟又名捻頸瘟喉痹失音咳聲不爽頸筋脹大者是也宜荊防敗毒散主之薛立齋加元參馬屁勃牛蒡子歌曰荊防羌獨前柴草枳桔芎苓翹薄姜即汪訒庵醫方集解中之荊防敗毒散也中焦邪注未分布經云中焦如漚疏而逐之兼以解毒營衛不通病變夥脅起胸高嘔血如遍身腫塊色紅裹俗稱爪瓤溫者胸高脅起嘔血如汁者是也宜生犀飲主之麻油炒蒼朮犀角黃連芥茶即苦丁茶金汁即糞清黃土乃是生犀飲也俗稱疙瘩瘟者遍身紅腫發塊如瘤者是也宜人中黃散主之辰砂雄黃各一錢五分人中黃一兩共為末以桔梗薄荷湯調下二錢日三服夜二服水土之邪從口入人之口氣通於地故陰中水土之邪從舌而下於陰下焦為濁陰故濁邪從下入經云下焦如瀆決而逐之兼以解毒腹鳴湫痛逆寒生便清足重難移步此屬陰經治別分俗稱絞腸瘟者腹痛乾嘔便溺下重水泄不通臍築湫痛者宜雙解散主之此症又宜探吐如人虛脈弱者吐法忌之陶節庵雙解散即小柴胡加白芍陳皮是也俗稱軟腳瘟者便清泄白足重難移膝冷內慄者是也宜人參白虎湯加蒼朮主之鄒滋九曰疫癘一症多從口鼻而入直行中道流布三焦非比傷寒六經可表可下夫疫為穢濁之氣古人所以飲芳香採蘭草以襲芬芳之氣者重滌穢也及其傳變上行極而下下行極而上是以邪在上焦者為喉啞為口糜若逆傳膻中者為神昏舌絳為喉痛丹疹今觀葉天士先生立方解毒之中必佐芳香宣竅逐穢如犀角菖蒲銀花鬱金等類兼進至寶丹從表透里以有靈之物內通竅搜剔幽隱通者通鎮者鎮若邪入營中三焦相溷熱愈結邪愈深者理宜鹽苦大制之法仍恐性速直走在下故用元參金銀花露金汁瓜蔞皮輕揚理上所謂仿古法而不泥其法者也考是證惟張景岳喻嘉言吳又可論之最詳然宗張喻二氏恐有遺邪留患若宗吳氏又恐邪去正傷惟在臨症權衡無盛盛無虛虛而遺人夭殃方不愧為司命之職矣脾約邪犯太陽經禁下病人平素胃陰涸大腸燥結省更衣省更衣者乃大便少解之謂脾約休言是胃弱若遇傳經液必干終成枯槁邪難托麻仁速下存津液活變神明仲景法尚論篇云脾約一症乃其人未病先素慣脾約蓋約者省約也脾氣過強將三五日胃中所受之谷省約為一二彈丸而出全是脾土過燥致令腸胃中之津液日漸乾枯所以大便為難也及致感受風寒即邪未入胃而胃已先實所以邪至陽明不患胃之不實但患無津液以奉其邪立至枯槁耳仲景大變太陽禁下之例而另立麻仁丸以潤下之不比一時暫結者可用湯藥盪滌之耳此義從前瞶瞶凡遇素成脾約之人亦必俟經盡方下百無一生矣大黃酒蒸杏仁厚朴麻仁枳實蜜丸即仲景麻仁丸除中傷寒發熱利兼厥腹冷脈遲寒誤徹食不當能今反能胃陽發露除中卒除中者中氣除也卒者死也喻嘉言曰謂之胃陽發露凡厥利當不能食忽然能食暴熱一來其陽即散立斃之候也仲景厥陰條內有云傷寒脈遲至六七日而反與黃芩湯徹其熱脈遲為寒今與黃芩湯復除其熱腹中應冷當不能食今反能食此名除中必死息高邪入少陰六七日陡然氣急鼻微息息高長沙曾斷死破格挽回無救訣仲景云少陰病六七日息高者死喻嘉言云諸陽主氣息高則真氣上迸於胸中本實先撥而不能復歸於氣海故主死也六七日三字辨症最細見經傳少陰而息高與二三日太陽之作喘症迥殊也石室秘錄云傷寒少陰病六七日息高者死息高見於六七日之間明是少陰之症而非太陽之證也息高與氣喘大殊太陽之證乃氣喘本於邪盛少陰之證乃息高本於氣虛而息高者與氣喘終何以辨之氣喘者鼻息粗大息高者鼻息微小耳此乃下元之真氣欲絕而未絕牽連氣海之間故上行而非氣急之狀能上而不能下也最危最急之候方用止息湯核桃仁一個人參熟地各三兩牛膝破故紙各三錢麥冬三錢臺姜五分煎服此藥大補關元氣海復引火之下行絕不祛寒逐邪庶幾氣可回而息高者可平也倘疑是太陽喘症而妄用桂枝湯殺人於頃刻矣故必用止息湯救之十人中可望生五六然必須多服久服始效或服一劑而輒止亦未有能收功者又不可不知但此方在貧者斷不能用豪貴之家適有此症或可措辦故錄之戴陽顴若遊紅是戴陽或煩或躁或兼狂井中欲赴飲思冷八味還宜參附湯有一種戴陽症兩顴淺紅紅必遊移無定或煩躁狂發欲坐臥泥水中渴欲飲水復不能飲大便自利或秘結小便清白或淡黃咽喉或痛或不痛脈沉遲而微細肌表雖熱重按之則不熱甚者其冷透手此陰盛格陽也面紅煩躁口生刺舌如斂束荔枝似痰涎或湧喉煙沖身烙脈洪益火制有一種面紅煩躁遍舌生瘡生刺舌斂束如荔枝狀或痰誕湧盛喘急小便頻數口乾引飲兩唇焦裂喉間如煙火上衝兩足心如烙脈洪大而數無倫按之有力亦有按之微弱者捫其身烙手此腎虛火不歸經素問所謂脈從病反者也俱用十全大補吞八味丸或大劑八味飲合生脈散人參熟地可用至二三兩附子可用至三五錢如認作白虎症立死四君四物即八珍湯再加黃耆肉桂即十全大補湯直中直中三陰四逆湯附子乾薑甘草即四逆湯去甘草加蔥白即白通湯理中人參白朮炙草乾薑真武白朮茯苓附子白芍生薑亦為良莫云盛夏熱當禁此乃從症不從時之法經曰清蒸桂附強有一種色欲過度腠理疏豁寒邪乘虛而直入於三陰之經名曰陰症即俗稱陰症傷寒也初起不見熱症暴病所謂直中陰經者乃心肝脾肺腎之經受肅殺嚴寒之氣由肌肉間之經絡直逼臟中或心或肝或脾或肺或腎生氣被傷不得通達便成陰症也此時急以熱藥依經通之漸漸溫熱使臟中熱氣得通於肌肉間之經絡須以理中四逆真武等湯辨證而治之炎天客運值寒威裸體行淫風獨吹怕冷脈微沉且伏腹疼似暑細研推有一種陰症直入腎少陰之經或欲事後感寒或多欲陽虛寒乘虛入臍腹絞痛手足青紫厥逆脈微欲絕急煎附子理中湯與之外用蔥二束如茶盞大紮緊切一指厚一段置臍上以熨斗火熨之使熱氣透入腹逼邪外出為佳此症俗亦謂之陰症傷寒但陰症臍腹絞痛必怕寒怯冷凡中暑暍腹痛者並不是冷但此病偶值炎夏如或疑似先以冷井水令病人將手指浸內如陰症即行畏縮或手彈冷水於病人之臉上若果陰症必打寒噤若暑症見冷水必無畏忌大凡陰症與伏暑之症緣脈皆伏者多即暑症與陰症俱或有肚疼之狀臨診之際務須細心研究倘或誤治危殆立見反復餘邪反復食相糾凡傷寒復發世皆作有餘治必曰因食而起殊不知有餘不盡之毒留滯陽明胃經也蓋緣戰汗後氣血虧損之甚即以補陰得汗力只七八分便住表既得解便能清爽其不盡者復歸陽明加以一二日之飲食與邪相蒸復騰騰而作熱矣此乃汗後元氣驟虛飲食入胃生化遲緩於是所留之邪與新入之物合而為熱如依時師再用攻邪則元氣復虛熱邪益熾索然而死矣大劑當歸六子投六君子加當歸若芩連退邪枳樸消食必死無疑邪食交攻熱更劇守過三日汗來瘳縱有病愈增而熱愈甚者乃是邪與食為元氣所攻發將出之候也守不出三日復戰而汗解矣或曰汗至七八分而餘邪何以復歸陽明曰胃主肌肉元氣薄故也元氣厚者則無此病如留泊肌肉筋骨則為餘毒治法亦先補正陰虛勞復挾風微或奔走傷力或微挾食或微冒風寒劉氏地黃飲子奇歌曰二地骨皮耆芍杞芩防枳草配天冬即劉松石之地黃飲子素壯火多愈勞復若其人素壯實平日多火病愈勞復者亦不得用攻伐蔥冬七味湯宜速歌曰流水生薑蔥葛豉麥冬懷熟其成方即名七味蔥白湯損庵專法麥門冬用斤許此王肯堂法再入香豉和淡竹頻頻飲去自為佳海藏門冬皆可活麥冬甘草粳米大棗竹葉名海藏麥冬飲子治勞復氣欲絕者用之有效能起死回生易老加人參尤妙遺毒汗後仍然熱結深此汗出不徹仍然熱結之耳間一寸二三分毒發耳後或連耳下俱腫硬者名為頤毒頻頻腫此為遺熱成毒速散消遲膿必成初起速宜消散若緩則成膿又為害也一法用槐米四五兩炒微黃乘熱入酒二碗煎十餘沸去渣熱服未成者二三服已成者一二服胃弱者忌之一法用忍冬藤四五兩甘草節一兩先用水二碗煎至一碗再入酒一碗煎十餘滾去渣飲之渣可敷患處又三煎酒方頭一次以銀花一兩蒂丁一兩河水兩大碗井水兩大碗煎至兩碗去渣聽用第二次加廣皮甘草節白芷當歸各一錢再配後開引經藥將前汁煎至一碗去渣聽用第三次加乳香沒藥去油研末各一錢炒甲片研末三錢將煎汁配紹酒一碗煎至八分溫服暖睡汗出即瘥引經藥列後頭面加川芎犀角各一錢兩手臂加桂枝一錢兩乳加蒲公英一錢兩肋加木瓜一錢下部加牛膝一錢遍身加藁本一錢初起連翹敗毒散歌曰連翹敗毒獨羌防升草芎柴歸尾襄蘇木紅藍大力子天花粉配集成方水酒各半煎徐徐溫服如未消加蛤粉炒穿山甲一錢腫至面者加香白芷二錢漏蘆五分大便燥實者加酒浸大黃一錢五分壯者倍之凡內有熱寒熱交作者倍用柴胡加酒洗黃芩酒炒黃連各一錢膿成內托理須明宜內托消毒散歌曰升耆參草歸柴桔銀花防芷共翹芎水酒各半煎徐徐溫服治發頤有膿不可消已破未破皆可服感證如初便發癰發熱三四日後便發癰者陽明兼或少陽通有一起便發癰者治皆不外陽明少陽兩經竟有失於汗下中宮伏熱鬱極發為胃癰者須細審之若漫不加意懵然執傷寒之成法以治之鮮有不潰敗者肝腎如虛應大補此毒發於至陰之處道路遙遠必煎劑送大填大補丸藥方效否則遷延弱即叢遷延時日拖成弱症俗謂毒勞終不救也誅伐太過氣血傷有一種感證被俗師混加汗下以致誅伐太過氣血大傷究竟所感之邪鬱而不泄發為癰腫此時當急補正參耆熟地大歸湯黃耆當歸銀花甘草即世傳之大歸湯也再配人參熟地可加兩許以救之庶可起發收功翹連角刺芩施誤難起收功命必戕如誤用芩連角刺之類去生便遠此乃已被誅伐太過氣血大傷若再投寒涼透解其毒必陷其斃亦速非此陰虛遷延成毒癆之症也審之審之火實之人感又重辛涼大劑石膏黃有一種火實之人所感又重非大劑辛涼重用石膏不可甚者須加大黃伸縮之權存乎其人始初略解便滋陰此醫者過於小心也邪伏致癰郁毒生清解猶宜併發透騎牆主見害終成若作騎牆之見兼用固本則熱邪為潤藥黏滯不得通達必成大害矣慎之慎之固本等藥所以養胃今服養陰藥既多則胃中津液原不竭也且遺毒既自經絡而達肌表自當因勢利導之更參時毒辨凶吉五七之間命必脫旬外自能不治安時毒者感四時不正之氣初發狀似傷寒五七日間乃能殺人十日外不治自愈浮弦沉緊滑洪澀須分汗下藥休寒浮數者邪在表宜發之沉實者邪在裡宜下之醫不究心變莫測此症有陰有陽有可汗有可下常見粗工但云熱毒驟用寒涼不知病有輕重治有逆從豈容輕忽也按金匱有傷寒陰陽二毒遍身紅暈形似湯豬方中所用升麻鱉甲雄黃川椒桂枝等類而已然以理考之疑非仲景所制之方或後人託名附會嘗見用者亦多不效未敢信從故不錄載或已汗下腫不消或有出膿後腫仍不消小柴和解配連翹薄荷桔梗黃連共大力即牛蒡子元參花粉陶或加全蠍甲片腫甚痛焮宜砭血膿成脈弱仗參調此必先因胃虛飲食不節邪乘虛入宜從輕治發散解毒必加人參以固元氣魆地昏沉面部紅腮頤凸腫火如烘痰升體熱脈來數按之空大或浮而微陽脫頃亡莫認癰有少壯之人恃勇縱欲精泄氣脫以致命門真火奔越於上結於頭面三陽之位狀若癰毒人忽昏沉誤認為火若用寒涼隨藥而逝速投人參附子庶可挽救如無人參重用補血湯多加白朮附子亦有得生者此名脫陽症本不應列於發遺時毒之內但其狀似癰發亦驟然恐時醫誤作毒治致令人夭故特附於此狐惑唇瘡上下忽生來臟惑狐肛蟲作災聲啞喜眠須治熱犀連桃核用無乖李士材云狐惑失汗所致食少胃空蟲齧五臟故唇口生瘡其名曰惑蟲蝕其肛上唇生白點其名曰狐其候齒燥聲啞惡食面目乍赤乍白而眸黑舌上白胎唇黑四肢沉重喜眠清熱宜用黃連犀角木香烏梅治䘌宜用桃仁梔子艾葉大棗殺蟲宜用雄黃銳散桃仁苦參青箱子黃連等分為末以艾葉煎汁搗和成膏捏如小指大用絹裹納入穀道中陰陽易傷寒未愈輒交媾體重眼花艱小溲散亂精神膝脛拘熱沖少氣陰攣湊更兼裹急外邪無欲火恣情自作受男女裩襠互換嘗陰陽易病古非謬柯韻伯云此症無內外因本非傷寒而冠以傷寒者原其因也無惡寒發熱之表症無胃實自利之裡症因淫情之不禁而餘邪得以投其隙移禍於不病之人頓令一身精氣神形皆受欲火之害是不病於傷寒而病於陰陽之易也裩襠者即褲襠也男女陰陽之衛陰陽之以息相吹氣相聚精相向者也衛乎外者自能清乎內感於無形者以之治有形故取其近隱處燒灰水服之形氣邪感得其隱曲小便即利陰頭微腫濁陰走下竅清陽出上竅欲火平而諸症悉除矣男服女褌女服男褌仍合陰陽交易之理至穢之品為至奇之方以意相求有知此者金匱要略云陰陽易病凡診有離經脈見者死離經者乍大乍小忽有忽無參差不齊者是也治以豭鼠糞湯用韭菜根一大握兩頭尖十四粒以水煎服內傷感熱似痢勞倦內傷外感熱身如燔炭便膿血脈來洪數與無倫甚者散亂忽有忽無譫語更兼舌燥黑此屬陽明症甚危熟地一兩杞冬歸芍甘相佐再配生地見微汗有汗可治其脈亦須接續分明洪數鼓指見汗又必前方去生地加棗仁山藥萸肉丹皮連服七八劑俟脈平和方下推俟脈必斂而圓再用當歸白芍甘草薄荷此四味名四順清涼飲子加酒蒸大黃五錢熟地一兩下黑矢而愈一二日來復熱譫原因作汗喘狂端前已下黑矢而愈一二日後復發熱狂譫喘急口渴此欲作汗解也乾薑歸芍草耆朮乾薑歸芍各三錢耆術各一兩甘草一錢其汗如淋病霍然以上三韻統講一症董廢翁曰或問陽明熱甚當速解其毒今先補後下何也曰毒火燔熾涼膈承氣症也而其原起於勞倦陽邪內灼脈已無陰若驟下之則毒留而陰絕死不治矣曰復病又以他藥治何也曰病從陽入必從陽解今陰氣已至而無以鼓動之則營衛不洽汗無從生不汗則虛邪不得外達故內沸而復也此乃里虛勞倦之輩感挾時令燥氣之變局也初起壯熱狀若腸澼若執治痢成法多致不救予遇三四病家信任專托依法用之多得全活但此症常有故錄數言以告同志凡遇此項脈症莫認作痢疾誤治殺人且標目似痢二字蓋似者疑似之義原與滯下之痢不同宜辨明治之娠妊胎產婦女傷寒按準繩王肯堂所著六經治例等平人經期時候須明辨婦女諸病須參薛立齋醫案陳臨川婦女良方武叔卿濟陰綱目等書言之最詳業醫者宜考惟有妊娠四物君生地當歸白芍川芎初起黃芩白朮佐已任編云使熱邪不能深入血分以觸犯胎氣為異耳行攻滑破莫相侵滑潤如半夏滑石之類行血如肉桂附子之類破血如桃仁牛膝丹皮之類攻下如大黃芒硝之類俱宜慎之若還產後身如熱外感血虛須認明吳綬云產後傷寒不可輕易發汗蓋有產時傷力發熱者有去血過多發熱者有惡露不盡發熱者有三日乳蒸發熱者或早起勞動飲食停滯皆有發熱狀類傷寒而須詳辨劉完素云大抵產病天行從增損柴胡雜症從增損四物宜詳察脈症而用之王海藏云凡婦人傷寒六經治例皆同有懷妊者則以四物為君養血安胎又云娩後露體中風傷衛自汗宜桂枝湯加紅花或配黑魚頭骨更妙朱丹溪云產後諸病當大補氣血為主余作末治張介賓云此言雖是然亦不必拘泥余有辨論在全書內婦人類中學者亦考產後中風危急屢驗方以黑豆一茶鍾連須蔥頭五個先將黑豆焙至有煙時再入蔥頭黃酒一鍾水一鍾半煎至一鍾服之汗出即愈傳之救人莫大陰功此方從古北陳杰回生集抄附於此云是牛欄山楊醫所授系葛仙翁乩傳之方也寶之寶之經脈胎產等疾予另編有資生別傳一帙裒採達生產寶諸書韙論而成集仍遵景岳之法證分九類方列八陣後附仙授牡丹等方華岫云曰傷寒症仲景立法於前諸賢註釋於後今觀葉天士先生擬其治法其所以異於庸醫者在乎能辨症耳不以冬溫春溫風溫溫熱濕溫伏暑內傷勞倦瘟疫等症誤認為傷寒其治溫熱暑濕諸症專辨邪之在衛在營或傷氣分或傷血分更專究三焦故能述前人溫邪忌汗濕家忌汗當用手經之方不必用足經之藥等明訓垂示後人此乃先生獨擅見長之處也華玉堂云古人有言曰仲景之法不但治傷寒苟能悉明其理即治一切六氣之病與諸雜症皆可融會貫通無所不宜此誠屬高論固深知仲景者也然予謂六淫之邪頭緒甚繁其理甚奧即彙集河間東垣丹溪及前賢諸法而治之猶慮未能兼括盡善若沾沾焉必欲但拘仲景之法而施治此乃見聞不廣膠柱鼓瑟不知變通者矣四明心法附註楊云峰驗舌指南近世傷寒多內傷庸醫不識妄投湯病家又且無張主遂致遷延變敗亡嘗讀己任編參究高鼓峰治感證之法皆本薛新甫張介賓之精義茲予抉其粹髓撰成歌訣以便學者易於記誦若能潛心體認臨證自有把握口渴原非涉太陽一涉口渴則非太陽症矣禁投九味與麻黃口渴若見恐胃中津液將亡凡麻葛羌防之類易干津液所在當禁惟存津液為王道仲景傷寒論中最要緊關頭在存津液三字肺病白胎起刺詳生脈散如無人參枸杞可代加柴地芍歸耆芩草是良方以生金滋水腎氣凌心黑滑胎主方八味最堪裁腎乃北方玄武之色故屬黑且火位之下水氣承之水來救母此時泄火火無從泄助子以救母則仇未有不復者也亢則害承乃制其理昭然陰虧胎黑觀來燥的屬津枯六味該此腎水枯乾當急救其陰也凡烈焰近炙則燔手漸高則愈冷緣冷氣乃火逼所致熱病之舌黑即此理也黑聚舌中寒水侮其舌必兼滑嫩救須附子理中諧更有其舌同黑色一屬寒水侮土者宜用附子理中一系腎氣凌心者宜用人參八味其治又不相同何也寒水侮土者系陰盛於內逼陽於外外假熱而內真寒格陽也其黑色止聚於舌中腎氣凌心者系陰盛於下逼陽於上上假熱而下真寒戴陽也其黑色直抵於舌尖然未有不胖且嫩者又不論乾燥滋潤也楊云峰云若寒水侮土用八味乃是緩著補中益氣治黃胎再配芩連楊潛邨云如其舌後半截滑膩而有微黃胎者乃脾胃氣虛下陷止須補中益氣湯足矣補土生金果妙才有食去耆加厚朴仍留白朮汗能排且發其汗縱有食勿顧也歌曰補中益氣參歸草耆朮升柴新會皮即李東垣補中益氣湯也薑棗引滿舌鋪黃似薄漆胃陰不足氣將脫挽回妙義在知幾甘露飲加枸杞葉有一種中氣本虛胃陰不足之輩偶因勞倦發熱滿舌微薄黃胎狀如金漆光亮之色干而不燥口不思飲若誤作火邪妄投苦寒之劑則中臟之氣無不隨藥而脫如遇此等舌胎急宜用甘露飲重加枸杞以救之虛甚者可加人參歌曰二地二冬芩枳斛枇杷葉配草茵陳即孫真人千金方甘露飲舌頹防卷用逍遙舌本強直轉動不活而語言蹇澀者危傷寒厥陰條下經云舌卷囊縮者死不治歌曰逍遙芍術歸陳草薄荷柴芩配棗姜即王海藏醫壘元戒之逍遙散也加用丹芩生地高以滋水生肝舌色鮮紅生脈配人參麥冬五味即孫思邈千金方之生脈散也更須六味火能消此心經病也以滋水清火白加黃色黃加黑舌胎如是此腎凌脾人不識須治中宮益氣佳補中益氣為主看燥潤參以加減若還灰色須分別認明灰色用芩連四明心法云凡舌見灰色指甲括下無渣汁者方是火症乃芩連之對症味其語意可見陽邪燔灼則其陰液未有不幹枯者此等辨論俗工焉能曉得黑誤芩連命必絕舌上現形人字紋用心挽救空勞力黑乃腎水乾枯因誤用芩連舌上現出人字紋者必死舌色無拘胎有無總逢枯燥費思羅恐津液消亡慎勿視為泛常無胎鏡面皆應死一似豬腰子去膜一舌如鏡面者危一舌如去膜豬腰子者危一舌加火柿者危一舌竟無胎胃氣絕也不治有一種陽虛之人誤投寒涼致變危症其舌伸出形如蛇舌尖細擻擻而抖者亦是無救之症也荔肉砂皮糙刺形烘糕液涸化幽磷一舌糙刺如砂皮而乾枯燥裂者危一舌如烘糕者危雪花片片緣脾閉不久將為泉下魂呂批治法匯云舌上起白胎如雪花片者脾冷而閉也不治此胎痢疾症中更多以上所列皆垂死危候也然有不必如此而死者即至如此而灼見臟腑陰陽虛實再參鉤玄論之三法竭力挽回則亦有得生者時師既司人性命須存壽世婆心即於百不一活之症當作萬有一生之想縱使修短有數彭殤難齊破格出奇終於莫救致招從旁浮議同道中傷病家歸咎而反之吾心固無愧也倘畏避嫌疑而以此種危症目視不救再任其付諸庸劣之手則必無生理矣豈不痛哉五臟病因胎各色青黃黑白赤分晰經云肝屬木應東方其色蒼其味酸在音為角在聲為呼心屬火應南方其色赤其味苦在音為徵在聲為笑脾屬土應中央其色黃其味甘在音為宮在聲為歌肺屬金應西方其色白其味辛在音為商在聲為哭腎屬水應北方其色黑其味鹽在音為羽在聲為呻金生水水生木木生火火生土土生金金剋木木剋土土剋水水剋火火剋金此素問以五色應五臟而合五行相生相剋之理也業醫者不可不知斂堅蒼老實邪推驗舌分虛實法楊云峰云經曰邪氣盛則實正氣奪則虛又曰有餘者瀉之不足者補之竊謂虛實兩字是挈病機之領補瀉兩字是提治法之綱蓋以人之有病不出一虛一實醫之治病不過一補一瀉如虛實稍有疑心則補瀉無從下手是參症切脈以審虛實固臨症第一要著也乃有症似實而脈則虛脈似實而症則虛者如舍脈從症既難信以為真而舍症從脈又惟恐其是假奈之何哉不知凡物之理實則其形堅斂其色蒼老虛則其體浮胖其色嬌嫩而病現於舌也其形與色亦然故凡病屬實者其舌必堅斂而兼蒼老病屬虛者其舌必浮胖而兼嬌嫩如此分別則為虛為實是真是假雖未參症切脈而一目先了然矣胖論陰陽獻燥濕驗舌分陰陽法楊云峰云虛實既分補瀉固有定見然虛實各有陰陽而陰陽迭為虛實則於虛實分陰陽臨症者又不可混也而分之不得其法則有陰盛為陽盛陽虛為陰虛而不能無誤者且有症本陽虛而經訓曰陰虛令人錯解貽害不淺者如言陰虛出盜汗陰言手太陰也虛言肺氣虛也又言陰虛發夜熱陰言足太陰也虛言脾氣虛也同曰陰虛而其中有手足太陰之分名曰陰虛而其實脾肺氣虛之症無如歷代醫師從未註明其義誤以脾肺氣虛認為腎水不足而用滋陰降火之劑朝夕重陰下逼逼致土困金衰便溏聲嘶致之死地而不悟者只此兩個陰字拘義牽文訛以傳訛自古迄今普天之下不知日殺凡幾良堪痛也況如此類者經中未易枚舉總緣陰陽混雜虛實模糊但憑脈症分晰難清詎知陰虛陽盛而火旺者其舌必乾而燥陽虛陰盛而火衰者其舌必滑而濕如此分別則為陰為陽誰實誰虛顯然可見更何似陰似陽之疑以致重陰重陽之誤耶理勝金鏡錄一籌金鏡錄張三錫所注驗舌為準法楊云峰云舌者心之苗也五臟六腑之大主其氣通於此其竅開於此者也查諸臟腑圖脾肺肝腎無系不根於心核諸經絡考手足陰陽無脈不通於舌則知經絡臟腑之病不獨傷寒發熱有胎可驗即凡內外雜症無一不呈形著色於其舌是以驗舌一法臨症不可不講間嘗從金鏡錄三十六舌逐一體驗其法殊多未合及參已任編呂東莊有云金鏡三十六舌當參其意而勿泥其法更有三十六舌之所未及者須以意通之予於是臨症之下細心診視於四診之中驗舌更有獨得之秘據舌以分虛實而虛實不爽焉據舌以分陰陽而陰陽不謬焉凡危急疑難之頃往往病無可參脈無可按而惟以舌為憑婦女幼稚之病往往聞之無息問之無聲而惟有舌可驗是以陰陽虛實見之悉得其真補瀉寒暄投之輒神其應人以為奇有何奇哉不過同得之理耳臨診者誠潛心而有會焉則分之而臟腑各一陰陽也陰陽各一虛實也理圓而法到可以補金鏡之所未及而正不止三十六舌也合之而臟腑同此陰陽也陰陽同此虛實也理圓而法活可以裁金鏡之所未合而並不必三十六舌也分而分之其法不出乎五行合而合之其理總原於太極准此以臨症則諸病之變現總使萬葉千枝而一望之神明自可搜根拔本尚何無者生之有者甚之以干致邪失正絕人長命之咎哉鑑明可並月林石楊云峰先生驗舌之論以浮胖堅斂分虛實乾燥滑潤認陰陽黑白青黃辨臟腑蓋本至中至正之理以立至簡至易之法誠學者之階梯救世之津梁也予遵用之頗多得力故附錄於此惟願同志誦記於心幸勿諼爾嘗覽山海經西海有月林山其石光瑩明皎能照徹人之肺腑以上驗舌之法視其胎色則知病有各臟之因由觀其嫩老更明邪正陰陽之互異可謂隔垣而洞悉人之肝膽一望無遺猶如月林石能照徹人之五臟也故予取以喻此並勉世人若如用試金石治病莫若以月林石更效也不論四時與六經須知發熱感寒因其脈亦不浮緊而急逍遙散郁使邪達此乃外感寒而內發熱以火為寒邪所郁既為火鬱則逍遙散自可以統治矣兼食小柴合六君合小柴則六君全矣兼可助脾消食之妙然此是為兼食未經表散者定論發表已經八九朝只須竟用黑逍遙逍遙散加熟地即薛氏之黑逍遙也氣粗胎厚按胸痛潤下滋陰法論高視其微甚用逍遙散加熟地四五錢可用至一二兩此就已經發表者言蓋發表既多則津液乾枯宿物燥結而不能出故必重用熟地使陰血下潤則宿物自下攻裡若多莫再下勢輕四子加歸芍人參白朮茯苓甘草即四君子湯是症再加當歸白芍甚投附子與人參人參鬚要重用再加煨姜以發其汗發汗回陽論亦確下多則亡陽故用參附以回其陽陽回而汗自作矣冬月傷寒起畏寒此乃感受天時客令之風寒非隆冬主氣之嚴寒如果冒犯肅殺之寒威仍遵仲景之法辨明寒傷營風傷衛酌以麻黃桂枝等湯分別治之主方卻用前胡湯歌曰前胡蘇草陳皮桔半芷還須加棗姜即潔古老人之前胡湯不愈小柴加枳桔如不應手換小柴胡湯再配枳殼桔梗繼續逍遙無不安初感者以上法治之無不愈也熱覺脅疼與耳聾口乾舌黑燥生風火燥生風屬邪不清疏肝益腎如無應六味飲加柴胡白芍即高鼓峰之疏肝益腎湯柴芍歸脾立建功已燥不宜再燥須去木香並用米泔泡蒸白朮為妙歌曰當歸志棗香耆朮參草苓圓薑棗同即濟生方之歸脾湯也熱甚忽然手足腫更兼頭面塊瘰聳風淫末疾燥生疼此為風淫末疾也熱甚而痛手足亦有腫者竟有瘰塊如頤者滋腎生肝涼忌用此症忌用涼藥上方可加熟地一兩主之歌曰地術柴胡山五味瀉萸歸草配丹苓此已任編之滋腎生肝飲即趙養葵醫貫中之滋水清肝飲也痞滿實堅燥矢硬凡大便硬者除合仲景痞滿燥實堅全見者方議下雖宜承氣須三省還要六脈沉實有力者才可議下歌曰大承氣內硝黃草枳實還須樸棗姜即仲景之大承氣湯也大黃厚朴枳實此三味即小承氣湯大黃芒硝甘草此三味即調胃承氣湯桃核大黃桂枝芒硝甘草此五味即桃仁承氣湯粗工誤治耗真陰養氣補陰下最穩楊潛邨云陰枯便燥則補陰自可濡潤矣而必兼養氣者以推送無力也須安慰病人勿急於攻下守至數日自可奏效也奏效雖遲而實穩當的是仲景功臣不便不餐不必驚有不便而不食者粗工必主一便則邪去而膈清才能思食時醫所見或者如是予獨曰不然必須先養胃以助正助正以去邪如養未到則邪不即去不食不妨也縱然養正去邪亨所謂中氣足而積滯能通陰血潤而其便自下能食不便毋庸慮理謂推陳在致新或有一種不能便而能食者推陳致新倉廩盈溢自能通利不便毋庸憂慮也予撰斯歌非泛文理宗素難貫天人勉醫勤讀時溫故悟徹玄微道自尊予一生應酬濟世養生得力處全藉此篇學者慎毋忽焉吳石公云職操原同良相功調合燮理答蒼穹六經五臟殊天壤八要三才究始終貧富不分惟重命死生雖數必推衷賢愚何藉彰鄉曲自有人稱草上風李治菴云病者求醫似望仙醫人切莫故遲延不徒舉室愴惶甚床簣呻吟最可憐觀吳李二公之詩句具見仁心仁術足為後學規模宜佩於紳帶庶夙夜不忘痧脹抉要說張一庵云夫痧脹證者風濕火三氣相搏手足經二脈交侵陰陽錯亂而擾為病之發也蓋風者謂足厥陰之風木也濕者謂足太陰之濕土也火者謂手少陽之相火也一陽二陰曰震在卦為雷故痧初發即有雷厲風行烈火熬沙沙即濕土之狀為病至此死生只在須臾救之不速悔無及矣惟善治痧者為能救之其善治之法但當言解即用油頭繩括肩背臂膊之法或用針刺眉心人中等處而不言攻攻者謂汗下也蓋以病非一氣無所施其攻也不可汗下解之之法又必先取所勝者如火勝於濕則先刺之凡痧發火勝者多宜十指少商穴以針刺之為妙甚背再刺四腕委中穴以泄其火氣之有餘濕勝於火者必瀉則先吐之可投蘆粟湯或蕎麥湯以奪其濕氣之太過能使火濕和平則風木之氣不治而自解矣即至用藥無不同然濕氣不及則先以涼解之不愈然後以寒解之火氣不及則先以溫解之然後以熱解之火濕俱不及則知所勝者在風但投以辛甘之味能使風氣疏通則火濕二氣亦不治而自解矣至於動靜者陰陽之道也濕主乎陰靜也風火二氣皆主乎動陽也二陽一陰曰離在卦為火痧病悉退猶如雨過云開陰陽之氣和平日麗中天而離火昭明矣又內外者陰陽之體用也震內離外曰噬嗑內動則絞腸括肚外火則斑疹赤膚痧毒肆攻便有侵蝕臟腑之象也離內震外曰豐用藥得宜內則火毒潛消外則痧點漸沒於是表裡一清而氣血沖和肌膚亦得豐滿若如瘠弱多因飲食風冷調理失宜故耳至於人身之脈手六經所以法天足六經所以法地天地之道以出入為順者也故天氣入於地中地氣則從而順之生萬物以出於外以是知天之氣主入而不主出地之氣主出而不主入手足之經脈亦豈有異哉總之痧症非若傷寒之為病也傷寒之病只在足六經而手不與焉故治傷寒者或汗或吐或下或和解或利小便皆取其出而以從地道也痧脹之症止在足二經手一經耳手一經法天而既主入足二經法地而既主出故三氣相搏經脈交侵陰陽錯亂而為病發此所謂病非一氣無所施其攻也惟解為貴耳
